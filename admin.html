  --info:#7dd3fc;--infoB:#0284c7;--infoS:rgba(56,189,248,.12);--trial:#fde047;--trialB:#ca8a04;--trialS:rgba(250,204,21,.1);
  --hdr:linear-gradient(120deg,#050d26 0%,#0a1f5c 60%,#123a8c 100%);
  --sh:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.25);--sh2:0 20px 60px rgba(0,0,0,.6);
  --inBg:#0c1424;--hit:#854d0e;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:var(--bgGrad),var(--bg);background-attachment:fixed;color:var(--tx);min-height:100vh;transition:background-color .25s,color .25s;-webkit-font-smoothing:antialiased}
a{color:var(--pri)}
::selection{background:var(--priS)}

/* ========== Header ========== */
header{background:var(--hdr);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 6px 24px rgba(5,13,38,.35);position:relative;z-index:100}
header:after{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:linear-gradient(90deg,transparent,#f5b82e,transparent);opacity:.7}
header h1{margin:0;font-size:16px;font-weight:900;flex:1;min-width:200px;display:flex;align-items:center;gap:12px}
.brand-logo{width:42px;height:42px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 2px rgba(245,184,46,.35);flex:0 0 auto;object-fit:cover}
.brand-t{display:flex;flex-direction:column;line-height:1.35}
.brand-t small{font-size:11px;font-weight:700;color:#ffd76e;opacity:.95}
header .cfg{font-size:11.5px;font-weight:800;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:6px 12px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
header .hbtn{border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.09)!important;color:#fff!important;padding:8px 12px;border-radius:11px;font-weight:800;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,transform .05s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
header .hbtn:hover{background:rgba(255,255,255,.18)!important}
header .hbtn:active{transform:scale(.96)}
.hbtn.key{box-shadow:inset 0 -2px 0 #4ade80}
.hbtn.pass{box-shadow:inset 0 -2px 0 #c4b5fd}
.hbtn.set{box-shadow:inset 0 -2px 0 #7dd3fc}
.hbtn.logout{background:rgba(239,68,68,.22)!important;border-color:rgba(252,165,165,.4)!important}
.hbtn.logout:hover{background:rgba(239,68,68,.38)!important}
#themeBtn{min-width:40px;justify-content:center;font-size:15px}

/* ========== Tabs ========== */
nav.tabs{background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);display:flex;flex-wrap:nowrap;padding:6px 10px;position:sticky;top:0;z-index:90;overflow-x:auto;gap:4px;box-shadow:0 4px 14px rgba(16,24,40,.05);-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:1px solid transparent;padding:9px 13px;font-size:13px;font-weight:800;color:var(--tx2);cursor:pointer;border-radius:11px;white-space:nowrap;transition:background .15s,color .15s}
nav.tabs button:hover{background:var(--card2);color:var(--tx)}
nav.tabs button.active{color:var(--pri);background:var(--priS);border-color:color-mix(in srgb,var(--pri) 30%,transparent)}
nav.tabs button .badge{color:#fff;border-radius:10px;padding:1px 7px;font-size:10.5px;margin-right:5px;font-weight:900;display:inline-block;min-width:20px;text-align:center;background:var(--badB)}
nav.tabs button .badge.warn{background:var(--warnB)}
nav.tabs button .badge.ok{background:var(--okB)}
nav.tabs button .badge.info{background:var(--pri2)}
nav.tabs button .badge.vio{background:var(--vioB)}

/* ========== البحث الذكي ========== */
.srch{position:sticky;top:56px;z-index:89;display:flex;align-items:center;gap:8px;margin:12px auto 0;max-width:1376px;width:calc(100% - 24px);padding:6px 8px 6px 12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);transition:border-color .15s,box-shadow .15s}
.srch:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px var(--priS),var(--sh)}
.srch-ic{font-size:17px;opacity:.8}
.srch input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.srch input{flex:1;min-width:0;border:0!important;background:transparent!important;box-shadow:none!important;font-size:15px;padding:9px 4px!important;margin:0!important;color:var(--tx)}
.srch-x{border:0;background:var(--card2);color:var(--tx2);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:13px}
.srch-n{font-size:12.5px;font-weight:900;color:var(--pri);white-space:nowrap;background:var(--priS);padding:4px 10px;border-radius:20px}
.srch-n:empty{display:none}
.srch-hit{background:var(--hit);color:inherit;border-radius:3px;padding:0 1px}
.srch-why{font-size:12px;color:var(--tx2);margin:-4px 0 10px}
.srch-why b{color:var(--pri)}

/* ========== Main ========== */
main{padding:14px 12px 40px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--bd)}
.card-title{font-size:15.5px;font-weight:900;color:var(--tx);margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-title .count{background:var(--priS);color:var(--pri);padding:2px 11px;border-radius:20px;font-size:12px}
.card-title .note{font-size:11.5px;color:var(--mut);font-weight:400}

/* ========== Login ========== */
.login-wrap{max-width:410px;margin:0 auto;padding:max(48px,9vh) 16px 30px;min-height:100vh}
.login-wrap .card{padding:30px 24px 24px;border-radius:24px;box-shadow:var(--sh2);position:relative;overflow:hidden}
.login-wrap .card:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,#1747b5,#f5b82e,#1747b5)}
.login-wrap h2{text-align:center;color:var(--tx);margin:0 0 6px;font-size:21px;font-weight:900}
.login-wrap .logo{text-align:center;margin:0 auto 12px;width:84px;height:84px;border-radius:22px;overflow:hidden;box-shadow:0 12px 30px rgba(10,36,98,.35),0 0 0 4px rgba(245,184,46,.2);font-size:0}
.login-wrap .logo img{width:100%;height:100%;display:block}
.login-wrap .sub{text-align:center;color:var(--mut);font-size:13px;margin:0 0 18px}
.login-theme{position:fixed;top:14px;left:14px;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:17px;cursor:pointer;box-shadow:var(--sh);z-index:5}

/* ========== Forms ========== */
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--bd2);border-radius:12px;font-family:inherit;font-size:14px;margin-top:6px;background:var(--inBg);color:var(--tx);transition:border-color .15s,box-shadow .15s,background .15s}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);background:var(--card);box-shadow:0 0 0 4px var(--priS)}
label{font-size:12.5px;font-weight:800;color:var(--tx2);display:block;margin-top:12px}
button{font-family:inherit}
.btn{border:none;padding:8px 14px;border-radius:10px;font-weight:800;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;transition:transform .05s,filter .15s,box-shadow .15s;white-space:nowrap;text-decoration:none;line-height:1.3}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 30%,transparent)}
.btn.success{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff}
.btn.violet{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff}
.btn.whatsapp{background:#25D366;color:#fff;padding:5px 10px;font-size:11.5px}
.btn.whatsapp.wa-done{background:#5b6b8c;color:#fff}
.tr-act{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:800;white-space:nowrap}.tr-act.on{background:#dcfce7;color:#166534}.tr-act.off{background:#fee2e2;color:#b91c1c}.tr-act.exp{background:#fef3c7;color:#92400e}
.wa-meta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10.5px;color:var(--mut)}
.wa-meta button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:10.5px;text-decoration:underline;padding:0}
.src-warn{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:8px;font-size:10.5px;font-weight:800;background:var(--warnS,#fff3e0);color:var(--warn,#e65100);border:1px dashed currentColor}
.ap-filter{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.ap-filter button{border:1px solid var(--bd);background:var(--card);color:var(--tx2);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer}
.ap-filter button.on{background:var(--priS);color:var(--pri);border-color:var(--pri)}
.btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
.btn.ghost{background:var(--card2);color:var(--tx2);border:1px solid var(--bd)}
.btn.ghost:hover{background:var(--priS);color:var(--pri);filter:none}
.btn.small{padding:6px 10px;font-size:11.5px;border-radius:9px}
.btn.block{width:100%;padding:13px;border-radius:13px;font-size:14.5px;justify-content:center}

/* ========== Toolbar ========== */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar .card-title{margin:0}
.toolbar .grow{flex:1}

/* ========== Table ========== */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;border:1px solid var(--bd)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:900px}
th,td{padding:11px 12px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:middle}
th{background:var(--card2);font-weight:900;color:var(--tx2);font-size:11.5px;white-space:nowrap;letter-spacing:.2px}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--card2)}
tbody tr:last-child td{border-bottom:0}
tr.trial td:first-child{box-shadow:inset -4px 0 0 var(--trialB)}
tr.pending td:first-child{box-shadow:inset -4px 0 0 var(--warnB)}
tr.approved td:first-child{box-shadow:inset -4px 0 0 var(--okB)}
tr.rejected td:first-child{box-shadow:inset -4px 0 0 var(--badB)}
tr.conflict td:first-child{box-shadow:inset -4px 0 0 var(--infoB)}
tr.reset-pw td:first-child{box-shadow:inset -4px 0 0 var(--vioB)}
tr.pending{background:color-mix(in srgb,var(--warnS) 60%,transparent)}
tr.rejected{background:color-mix(in srgb,var(--badS) 55%,transparent)}
tr.reset-pw{background:color-mix(in srgb,var(--vioS) 60%,transparent)}
tr.conflict{background:color-mix(in srgb,var(--infoS) 55%,transparent)}
td .actions{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-start}
td .mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
input.inline,select.inline{width:auto;display:inline-block;padding:6px 9px;font-size:12px;margin:2px 2px 2px 0;min-width:70px;border-radius:9px}

/* ========== Cards view for mobile ========== */
.cards-view{display:none}
.acct-card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.acct-card.conflict{border-right:4px solid var(--infoB)}
.acct-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.acct-card .email{font-family:monospace;direction:ltr;font-size:11.5px;background:var(--card2);color:var(--tx);padding:3px 8px;border-radius:6px;word-break:break-all;display:inline-block}
.acct-card .name{font-weight:900;font-size:14px;color:var(--tx);margin-top:4px}
.acct-card .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;margin:6px 0}
.acct-card .meta b{color:var(--mut);font-weight:800}
.acct-card .actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}

/* ========== Badges ========== */
.badge-status{padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:900;display:inline-flex;align-items:center;gap:4px;border:1px solid transparent}
.badge-status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.s-trial{background:var(--trialS);color:var(--trial)}
.s-pending{background:var(--warnS);color:var(--warn)}
.s-approved{background:var(--okS);color:var(--ok)}
.s-rejected,.s-expired{background:var(--badS);color:var(--bad)}
.s-conflict,.s-device_transfer_pending{background:var(--infoS);color:var(--info)}
.s-reset-pw,.s-password_reset{background:var(--vioS);color:var(--vio)}
.s-suspended,.s-disabled,.s-deleted,.s-cancelled{background:var(--badS);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.badge-plan{background:var(--priS);color:var(--pri);padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:900;display:inline-block;margin:1px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;background:var(--card2);color:var(--tx);border:1px solid var(--bd);padding:2px 7px;border-radius:6px;font-size:11px}
.keybox{direction:ltr;text-align:center;letter-spacing:3px;font-family:monospace;font-size:22px;font-weight:900;background:var(--okS);color:var(--ok);border:1px dashed color-mix(in srgb,var(--ok) 45%,transparent);padding:16px;border-radius:14px;margin:12px 0;word-break:break-all}
.muted{color:var(--mut);font-size:12px}
.devicetag{display:inline-block;background:var(--card2);color:var(--tx2);border:1px solid var(--bd);padding:2px 7px;border-radius:7px;font-size:10.5px;margin:1px}
.cfgbox{background:var(--vioS);padding:12px;border-radius:12px;font-size:12px;color:var(--vio);word-break:break-all;margin-top:10px}
.hint{background:var(--goldS);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:12px;padding:11px 12px;margin-top:14px;font-size:12.5px;color:var(--tx2);line-height:1.8}
.phone-input{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.phone-input a{flex-shrink:0}

/* ========== Modal ========== */
.modal-bg{position:fixed;inset:0;background:rgba(5,13,38,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:22px;max-width:420px;width:100%;box-shadow:var(--sh2);animation:mIn .25s ease}
@keyframes mIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 10px;color:var(--tx)}

/* ========== Stats ========== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{--c:var(--pri);--cs:var(--priS);background:var(--card);border-radius:16px;padding:14px 16px;border:1px solid var(--bd);box-shadow:var(--sh);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;inset:auto auto -30px -30px;width:90px;height:90px;border-radius:50%;background:var(--cs);opacity:.8}
body.admin-dark .stat:after{opacity:.45}
.stat .ic{grid-row:1/3;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:var(--cs);position:relative;z-index:1}
.stat .num{font-size:26px;font-weight:900;color:var(--c);line-height:1.1;position:relative;z-index:1}
.stat .lbl{font-size:11.5px;color:var(--mut);font-weight:800;position:relative;z-index:1}
.stat.warn{--c:var(--warnB);--cs:var(--warnS)}
.stat.ok{--c:var(--okB);--cs:var(--okS)}
.stat.vio{--c:var(--vioB);--cs:var(--vioS)}
.stat.trial{--c:var(--trialB);--cs:var(--trialS)}
.stat.info{--c:var(--pri);--cs:var(--priS)}
.stat.tr{--c:var(--infoB);--cs:var(--infoS)}

/* ========== Responsive ========== */
@media(max-width:760px){
  header{padding:10px 12px}
  header h1{font-size:14px;min-width:100%}
  .brand-logo{width:36px;height:36px;border-radius:10px}
  header .hbtn{padding:7px 10px;font-size:11.5px}
  nav.tabs{padding:5px 6px}
  nav.tabs button{padding:8px 10px;font-size:12px}
  .srch{top:50px;width:calc(100% - 12px);margin-top:8px}
  main{padding:10px 6px 30px}
  .card{padding:13px;border-radius:15px}
  .tbl-wrap{display:none}
  .cards-view{display:block}
  th,td{padding:6px 5px;font-size:11px}
  .login-wrap .card{padding:26px 16px 20px}
  .stats{grid-template-columns:repeat(3,1fr);gap:7px}
  .stat{padding:10px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border-radius:14px}
  .stat .ic{display:none}
  .stat:after{display:none}
  .stat{border-top:3px solid var(--c)}
  .stat .num{font-size:21px}
  .stat .lbl{font-size:10.5px}
}

/* ========== جدول الحسابات (موحّد للحاسوب والهاتف) ========== */
.acct-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;border:1px solid var(--bd)}
table.acct-tbl{min-width:1000px;table-layout:auto}
table.acct-tbl th{position:sticky;top:0;z-index:1}
table.acct-tbl td{vertical-align:top}
table.acct-tbl th:nth-child(1){min-width:170px}
table.acct-tbl th:nth-child(7){min-width:190px}
.at-school{font-weight:900;color:var(--tx);font-size:13.5px}
.at-strong{font-weight:800}
.at-sub{font-size:10.5px;color:var(--mut);margin-top:4px}
.at-num{font-weight:900;color:var(--mut);margin-left:4px}
.at-ltr{direction:ltr;unicode-bidi:plaintext}
.at-copy{cursor:pointer;background:var(--goldS)!important;color:var(--tx)!important;border-color:color-mix(in srgb,var(--gold) 40%,transparent)!important}
.at-warn{font-size:10.5px;color:var(--warn);font-weight:800}
.at-bad{color:var(--bad);font-weight:800}
.at-in{width:130px!important;max-width:100%;margin-top:5px;display:block!important}
.at-plan{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.at-amt{width:90px!important;flex:0 0 auto}
.at-plan select{width:auto!important;flex:0 0 auto}
.at-actions{display:flex;flex-wrap:wrap;gap:4px}
.at-v{min-width:0}
.at-v .badge-plan{display:inline-block}
@media(max-width:760px){
  .acct-wrap{border:0;overflow:visible}
  table.acct-tbl,table.acct-tbl tbody{display:block;min-width:0;width:100%}
  table.acct-tbl thead{display:none}
  table.acct-tbl tr{display:block;border:1px solid var(--bd);border-radius:15px;margin-bottom:10px;padding:4px 12px;box-shadow:var(--sh);background:var(--card)}
  table.acct-tbl tr.trial{border-right:4px solid var(--trialB)}table.acct-tbl tr.pending{border-right:4px solid var(--warnB)}table.acct-tbl tr.approved{border-right:4px solid var(--okB)}
  table.acct-tbl tr.rejected{border-right:4px solid var(--badB)}table.acct-tbl tr.conflict{border-right:4px solid var(--infoB)}table.acct-tbl tr.reset-pw{border-right:4px solid var(--vioB)}
  table.acct-tbl tr td:first-child{box-shadow:none}
  table.acct-tbl td{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start;padding:8px 0;font-size:12px;border-bottom:1px dashed var(--bd)}
  table.acct-tbl td:last-child{border-bottom:0}
  table.acct-tbl td::before{content:attr(data-label);font-weight:800;color:var(--mut);font-size:11.5px;padding-top:2px}
  table.acct-tbl td.at-head{grid-template-columns:1fr;border-bottom:1px solid var(--bd)}
  table.acct-tbl td.at-head::before{display:none}
  table.acct-tbl td.at-head .at-school{font-size:15px}
  table.acct-tbl td.at-act{grid-template-columns:1fr}
  table.acct-tbl td.at-act::before{display:none}
  .code.at-ltr{word-break:break-all}
  .at-in{width:100%!important;max-width:200px}

function subscriptionExpiry(plan){
  const selected=normalizePlan(plan)||"monthly";
  return selected==="permanent"?0:Date.now()+planDays(selected)*86400000;
}
function approve(email, plan, amount){
  const k=emailKey(email);
  const selected=normalizePlan(plan)||"monthly";
  const days=planDays(selected);
  db.ref("activation/accounts/"+k).update({
    status:"approved",accountDisabled:false,disabledReason:null,
    plan:selected,planCode:selected,durationDays:days,
    approvedAt:firebase.database.ServerValue.TIMESTAMP,
    expiresAt:subscriptionExpiry(selected),
    paidAmount:amount||"",
    planChangedAt:null,previousPlan:null,previousExpiresAt:null
  }).then(()=>alert("✅ تم تفعيل الاشتراك: "+planLabel(selected)))
    .catch(e=>alert("❌ تعذر حفظ التفعيل: "+e.message));
}
function resolveAccountKey(ref){
  const raw=String(ref||"");
  // The table already knows Firebase's exact key. Prefer it; only encode an email
  // when the caller supplied an email address. This prevents a plan update from
  // accidentally targeting a second key and leaving the visible account monthly.
  return Object.prototype.hasOwnProperty.call(allAccounts,raw)?raw:emailKey(raw);
}
function changePlan(accountRef, plan, amount){
  const k=resolveAccountKey(accountRef);
  const selected=normalizePlan(plan);
  if(!selected||!planDays(selected)){alert("اختر مدة اشتراك صحيحة");return;}
  const current=allAccounts[k]||{};
  const oldPlan=normalizePlan(current.plan||current.planCode)||"monthly";
  const oldExpiry=current.expiresAt||0;
  const displayEmail=current.email||String(accountRef||"").replace(/,/g,".");
  if(oldPlan===selected && selected!=="permanent" && oldExpiry>Date.now()){
    if(!confirm("الاشتراك مضبوط حالياً على "+planLabel(selected)+". هل تريد إعادة بدء مدته من الآن؟"))return;
  }else if(!confirm("تغيير اشتراك العميل من "+planLabel(oldPlan)+" إلى "+planLabel(selected)+"؟\nستبدأ المدة الجديدة من الآن، ويمكن تغييرها لاحقاً في أي وقت."))return;
  const patch={
    status:"approved",accountDisabled:false,disabledReason:null,
    plan:selected,planCode:selected,durationDays:planDays(selected),
    expiresAt:subscriptionExpiry(selected),
    planChangedAt:firebase.database.ServerValue.TIMESTAMP,
    previousPlan:oldPlan,previousExpiresAt:oldExpiry
  };
  if(amount!==undefined && String(amount).trim()!=="")patch.paidAmount=amount;
  const ref=db.ref("activation/accounts/"+k);
  ref.update(patch)
    .then(()=>ref.once("value"))
    .then(snap=>{
      const saved=snap.val()||{};
      const savedPlan=normalizePlan(saved.plan||saved.planCode);
      if(savedPlan!==selected){
        throw new Error("Firebase أعاد الخطة "+planLabel(savedPlan||"غير معروفة")+" بدلاً من "+planLabel(selected));
      }
      alert("✅ تم تغيير مدة اشتراك "+displayEmail+" إلى: "+planLabel(selected));
      renderAll();
    })
    .catch(e=>alert("❌ لم يتم تغيير مدة الاشتراك: "+e.message));
}

let currentTab="all";
/* ====== البحث الذكي في الحسابات ====== */
function normAr(t){
  return String(t==null?"":t)
    .replace(/[\u0660-\u0669]/g,d=>String(d.charCodeAt(0)-0x0660)).replace(/[\u06F0-\u06F9]/g,d=>String(d.charCodeAt(0)-0x06F0))
    .replace(/[\u064B-\u0652\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .toLowerCase().replace(/\s+/g," ").trim();
}
function phoneDigits(p){ const d=normAr(p).replace(/[^0-9]/g,""); return d?normIraqPhone(d):""; }
let adSearchQ="";
function adSearchFields(r){
  return [
    ["الهاتف",r.phone],["المدرسة",r.schoolName],["المدير",r.principalName],["اسم الحساب",r.name],["البريد",r.email],
    ["المرحلة",r.schoolStage?stageLabel(r.schoolStage):""],["الحالة",statusLabel(r.status)],["الاشتراك",r.plan||r.planCode?planLabel(r.plan||r.planCode):""],
    ["المبلغ",r.paidAmount],["المحافظة",r.governorate||r.city||r.province||""]
  ];
}
function adSearchMatch(r,q){
  const toks=normAr(q).split(" ").filter(Boolean); if(!toks.length) return null;
  const f=adSearchFields(r), why=new Set(); let score=0;
  for(const t of toks){
    let ok=false; const dig=t.replace(/[^0-9]/g,"");
    if(dig.length>=3&&dig.length===t.length){ /* رقم: يُطابق الهاتف بأي صيغة (07.. أو 964.. أو جزء منه) */
      const pd=phoneDigits(r.phone), qd=normIraqPhone(dig), qn=dig.replace(/^0+/,"");
      if(pd&&(pd.includes(dig)||pd.includes(qd)||(qn.length>=3&&pd.includes(qn)))){ ok=true; why.add("الهاتف"); score+=pd===qd?100:40; }
    }
    if(!ok){ for(const [lab,val] of f){ const v=normAr(val); if(v&&v.includes(t)){ ok=true; why.add(lab); score+=(v===t?30:(v.startsWith(t)?20:10)); break; } } }
    if(!ok) return null;
  }
  return {score,why:[...why]};
}
function highlightIn(html,q){
  const toks=normAr(q).split(" ").filter(t=>t.length>=2&&!/^[0-9]+$/.test(t)); if(!toks.length) return html;
  return html.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>{ if(tag) return tag;
    let out=txt; if(txt.indexOf('&')>=0) return txt; toks.forEach(t=>{ const src=out, ns=normAr(src); if(ns.length!==src.toLowerCase().length) return; const i=ns.indexOf(t); if(i>=0) out=src.slice(0,i)+'<mark class="srch-hit">'+src.slice(i,i+t.length)+'</mark>'+src.slice(i+t.length); });
    return out; });
}
function renderAdSearch(){
  const box=$("tab-search"), n=$("adSearchN"), x=$("adSearchX"); if(!box) return;
  const q=adSearchQ.trim();
  if(x) x.style.display=q?"":"none";
  if(!q){ box.style.display="none"; box.innerHTML=""; if(n) n.textContent=""; const t=$("tab-"+(currentTab||"all")); if(t) t.style.display="block"; return; }
  const recs=Object.entries(allAccounts||{}).map(([k,v])=>({emailKey:k,email:(v.email||k.replace(/,/g,".")),...v}));
  const hits=[]; recs.forEach(r=>{ const m=adSearchMatch(r,q); if(m) hits.push({r,m}); });
  hits.sort((a,b)=>b.m.score-a.m.score||((b.r.registeredAt||0)-(a.r.registeredAt||0)));
  const why=[...new Set(hits.flatMap(h=>h.m.why))];
  if(n) n.textContent=hits.length?("النتائج: "+hits.length):"لا نتائج";
  document.querySelectorAll(".tab").forEach(t=>t.style.display="none");
  box.style.display="block";
  box.innerHTML=hits.length
    ? '<div class="srch-why">البحث عن «<b>'+esc(q)+'</b>» — وُجد في: <b>'+esc(why.join("، "))+'</b></div>'+highlightIn(renderTable(hits.map(h=>h.r),"🔎 نتائج البحث ("+hits.length+")"),q)
    : '<div class="card"><p class="muted">لا يوجد زبون يطابق «'+esc(q)+'». جرّب جزءاً من الرقم أو من اسم المدرسة أو المدير.</p></div>';
}

        const d=Math.ceil((r.expiresAt-Date.now())/86400000);
        exp=`<div class="at-sub ${d<0?"at-bad":d<=7?"at-warn":""}">ينتهي: ${fmtDate(r.expiresAt)} (${d<0?"منتهي":"باقي "+d+" يوم"})</div>`;
      }
      planCell=`<span class="badge-plan">${planLabel(r.plan||r.planCode)}</span>${exp}
        <div class="at-plan"><select class="inline" id="chg-${k}">${planOptions(currentPlan)}</select>
        <input type="text" id="pa-${k}" data-paid-for="${email}" value="${esc(r.paidAmount||"")}" placeholder="المبلغ" class="inline at-ltr at-amt" /></div>`;
    }else{
      planCell=`<div class="at-plan"><select class="inline" id="pl-${k}">${planOptions("monthly")}</select>
        <input type="text" id="pa-${k}" data-paid-for="${email}" value="${esc(r.paidAmount||"")}" placeholder="المبلغ" class="inline at-ltr at-amt" /></div>`;
    }

    /* 7) الإجراءات */
    const actions=`<div class="actions at-actions">
      ${isApproved
        ?`<button class="btn warn small" onclick="changePlan(${jsKey},pickIn(this,${jsChg}).value,pickIn(this,${jsPa}).value)">⏱ تغيير المدة</button><button class="btn small nbrc-btn" onclick="nbReceipt(${jsKey})">🧾 وصل الاشتراك</button>`
        :`<button class="btn success small" onclick="approve(${jsEm},pickIn(this,${jsPl}).value,pickIn(this,${jsPa}).value)">✔ فعّل</button>`}
      ${r.status!=="rejected"&&!isReset?`<button class="btn ghost small" onclick="reject(${jsEm})">رفض</button>`:""}
      ${isReset
        ?`<button class="btn violet small" onclick="resetPassword(${jsEm})">🔑 إرسال الرمز</button><button class="btn ghost small" onclick="clearReset(${jsEm})" title="إلغاء الطلب">✕</button>`
        :`<button class="btn violet small" onclick="resetPassword(${jsEm})" title="استعادة كلمة السر">🔑</button>`}
      ${!isStopped?`<button class="btn warn small" onclick="stopAccount(${jsEm})">⏹ إيقاف</button>`:""}
      <button class="btn danger small" onclick="del(${jsEm})">🗑 حذف</button>
    </div>`;

    return `<tr class="${cls}">
      <td data-label="اسم المدرسة" class="at-head"><div class="at-v">${schoolCell}</div></td>
      <td data-label="اسم المدير"><div class="at-v">${principalCell}</div></td>
      <td data-label="الإيميل"><div class="at-v">${emailCell}</div></td>
      <td data-label="الرقم السري"><div class="at-v">${pwCell}</div></td>
      <td data-label="رقم الموبايل"><div class="at-v">${phoneCell}</div></td>
      <td data-label="مدة التفعيل"><div class="at-v">${planCell}</div></td>
      <td data-label="الإجراءات" class="at-act"><div class="at-v">${actions}</div></td>
    </tr>`;
  }).join("");

  return `<div class="card">
    <div class="toolbar">
      <h3 class="card-title">${esc(title)} <span class="count">${list.length}</span></h3>
      <div class="grow"></div>
      <button class="btn ghost small" onclick="exportCSV()">⬇ CSV</button>
    </div>
    <div class="acct-wrap"><table class="acct-tbl">
      <thead><tr>
        <th>اسم المدرسة</th><th>اسم المدير</th><th>الإيميل</th><th>الرقم السري</th><th>رقم الموبايل</th><th>مدة التفعيل</th><th>الإجراءات</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function renderKeygen(){
  $("tab-keygen").innerHTML=`<div class="card">
    <h3 class="card-title">🔑 توليد مفتاح أوفلاين</h3>
    <p class="muted">أدخل معرّف الجهاز ونوع الاشتراك لتوليد مفتاح مرتبط بالجهاز (يعمل بدون إنترنت).</p>
    <label>معرّف الجهاز
      <input type="text" id="kgDev" dir="ltr" placeholder="A1B2C3D8" style="text-align:center;letter-spacing:3px;font-family:monospace;font-size:16px" maxlength="16" />
    </label>
    <label>نوع الاشتراك
      <select id="kgPlan">
        <option value="weekly">أسبوعي (7 أيام)</option>
        <option value="monthly" selected>شهري (30 يوم)</option>
        <option value="yearly">سنوي (365 يوم)</option>
        <option value="permanent">دائم</option>
      </select>
    </label>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" onclick="genKey()">🔓 توليد المفتاح</button>
    </div>
    <div id="kgResult"></div>
  </div>`;
}
function genKey(){
  const dev=$("kgDev").value.trim().toUpperCase().replace(/[^0-9A-F]/g,"");
  const plan=$("kgPlan").value;
  if(dev.length<6){alert("أدخل معرّف جهاز صحيح (الحروف+الأرقام الظاهرة في التطبيق)");return;}
  const k=offSig(dev,plan);
  $("kgResult").innerHTML=`<p style="margin-top:14px;font-weight:700">المفتاح (${planLabel(plan)}):</p>
    <div class="keybox" id="keyOut">${k}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('keyOut').textContent).then(()=>alert('تم النسخ'))">📋 نسخ</button>
      <a class="btn whatsapp" href="https://wa.me/?text=${encodeURIComponent('المفتاح: '+k)}" target="_blank">📱 مشاركة واتساب</a>
    </div>`;
}

function renderSettings(){
  $("tab-settings").innerHTML=`<div class="card">
    <h3 class="card-title">⚙️ الإعدادات</h3>
    <label>إعداد Firebase (JSON):
      <textarea id="sFb" dir="ltr" rows="7" style="font-family:monospace;font-size:12px;text-align:left;direction:ltr"></textarea>
    </label>
    <label>السر المشترك (مفاتيح الأوفلاين):
      <input type="text" id="sSec" dir="ltr" />
    </label>
    <div class="hint">
      💡 لتغيير كلمة سر الأدمن استخدم زر <b>🔒 تغيير كلمة السر</b> في الشريط العلوي (يتطلب كلمة السر الحالية).
    </div>
    <div style="margin-top:14px"><button class="btn primary" onclick="saveSettings()">💾 حفظ الإعدادات</button></div>
  </div>`;
  $("sFb").value=JSON.stringify(cfg.firebase,null,2);
  $("sSec").value=SECRET;
}
function saveSettings(){
  try{
    const t=($("sFb").value||"").trim();
    let fb=cfg.firebase;
    if(t){try{fb=JSON.parse(t);}catch(e){alert("JSON غير صحيح");return;}}
    cfg.firebase=fb;
    const sk=$("sSec").value.trim();
    if(sk){cfg.secret=sk;SECRET=sk;}
    saveCfgObj(cfg);
    alert("✅ تم الحفظ. سيتم إعادة التحميل.");location.reload();
  }catch(e){alert(e.message);}
}

function exportCSV(){
  const recs=Object.entries(allAccounts).map(([k,v])=>({emailKey:k,email:(v.email||k.replace(/,/g,".")),...v}));
  const rows=[["#","email","password","name","schoolName","schoolStage","schoolGender","principalName","phone","device_type","device_brand","device_os","device_browser","device_browser_version","device_screen","device_id","status","plan","registeredAt","approvedAt","expiresAt","paidAmount"]];
  recs.forEach((r,i)=>{
    const d=r.lastSeenDevice||{};
    rows.push([
      i+1,r.email,r.password||"",r.name||"",r.schoolName||"",stageLabel(r.schoolStage),genderLabel(r.schoolGender),r.principalName||"",
      normIraqPhone(r.phone||""),
      d.type||"",d.brand||"",d.os||"",d.browser||"",d.browserVersion||"",d.screen||"",d.id||"",
      r.status||"trial",r.plan||"",r.registeredAt||"",r.approvedAt||"",r.expiresAt||"",r.paidAmount||""
    ]);
  });
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="daragat-accounts-"+new Date().toISOString().slice(0,10)+".csv";a.click();
}

  $("loginPage").style.display="none";
  $("dashPage").style.display="block";
  if(!initFB()){switchTab("settings");return;}
  listenAccounts();
  switchTab("all");
}
document.getElementById("loginPass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
if(localStorage.getItem(LS_SES)==="1") goDash();

function amt(v){
  var s=String(v==null?'':v).trim(); if(!s) return 0;

  if(/مليون/.test(s)) n*=1e6; else if(/ألف|الف|آلاف|الاف|k/i.test(s)) n*=1000;

}

  Promise.all([logoImg(),(document.fonts&&document.fonts.ready)||Promise.resolve(),stampImg()]).then(function(a){
    var cv=draw(r,a[0],a[2]), url=cv.toDataURL('image/png'), name='وصل-اشتراك-'+String(r.schoolName||'مدرسة').replace(/[\\\/:*?"<>|\s]+/g,'-')+'.png';
    var old=$('nbRc'); if(old) old.remove();
    var m=document.createElement('div'); m.id='nbRc';
    var ph=normIraqPhone(r.phone||''), w=(/^07[0-9]{9}$/.test(ph)&&waPhone(ph))?waPhone(ph):'';
    m.innerHTML='<div class="bx"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font-size:17px">🧾 وصل الاشتراك</b><button class="btn ghost small" data-x>✕</button></div><img alt="وصل الاشتراك" src="'+url+'">'+
      '<div class="row"><button class="btn whatsapp" data-share>💬 إرسال على الواتساب</button><button class="btn success" data-save>⬇️ حفظ الصورة</button><button class="btn ghost" data-copy>📋 نسخ الصورة</button></div>'+
      '<div class="note" data-note>على الهاتف: «إرسال على الواتساب» يرسل <b>صورة الوصل</b> — اختر واتساب ثم الزبون.<br>على الحاسوب: تُنسخ الصورة ويُفتح واتساب الزبون — اضغط Ctrl+V في المحادثة ثم أرسل.</div></div>';
    document.body.appendChild(m);
    m.addEventListener('click',function(e){ if(e.target===m||e.target.closest('[data-x]')) m.remove(); });
    function save(){ var a2=document.createElement('a'); a2.href=url; a2.download=name; document.body.appendChild(a2); a2.click(); setTimeout(function(){ a2.remove(); },500); }
    function copyImg(){ return toBlob(cv).then(function(b){ if(navigator.clipboard&&window.ClipboardItem) return navigator.clipboard.write([new ClipboardItem({'image/png':b})]).then(function(){ return true; },function(){ return false; }); return false; }); }
    function openWa(){ var u=w?('https://wa.me/'+w+'?text='+encodeURIComponent(waText(r))):('https://wa.me/?text='+encodeURIComponent(waText(r))); window.open(u,'_blank'); }
    m.querySelector('[data-save]').onclick=save;
    m.querySelector('[data-copy]').onclick=function(){ copyImg().then(function(ok){ m.querySelector('[data-note]').innerHTML=ok?'✅ نُسخت الصورة — الصقها في محادثة الزبون (Ctrl+V).':'تعذر النسخ في هذا المتصفح — استعمل «حفظ الصورة».'; }); };
    /* nb-v1.88: الإرسال على الواتساب — الهاتف: مشاركة الصورة وحدها (إرفاق نص مع الصورة يجعل واتساب يتجاهل الصورة أحياناً)،
       ثم زر لفتح محادثة الزبون برسالة الوصل. الحاسوب: تُنسخ الصورة وتُحفظ ويُفتح واتساب الزبون للصق الصورة. */
    var MOB=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'');
    function note(h){ m.querySelector('[data-note]').innerHTML=h; }
    function copyTxt(t){ try{ if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(function(){ return true; },function(){ return false; }); }catch(e){} return Promise.resolve(false); }
    function step2(){ note('✅ أُرسلت صورة الوصل. <button class="btn whatsapp" data-wa2 style="margin-top:8px;width:100%">💬 فتح محادثة الزبون مع رسالة التفعيل</button>'); var b2=m.querySelector('[data-wa2]'); if(b2) b2.onclick=openWa; }
    m.querySelector('[data-share]').onclick=function(){
      var btn=this; btn.disabled=true; setTimeout(function(){ btn.disabled=false; },1500);
      toBlob(cv).then(function(b){
        var file=null; try{ file=new File([b],'receipt-'+receiptNo(r)+'.png',{type:'image/png',lastModified:Date.now()}); }catch(e){}
        var can=false; try{ can=!!(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})); }catch(e){}
        if(MOB&&can){
          copyTxt(waText(r));
          navigator.share({files:[file]}).then(step2,function(err){ if(err&&err.name==='AbortError'){ note('أُلغيت المشاركة. اضغط «إرسال على الواتساب» مرة أخرى واختر واتساب ثم الزبون.'); return; } desk(); });
          return;
        }
        desk();
      });
      function desk(){
        copyImg().then(function(ok){
          if(!ok) save();
          var u=(w?('https://wa.me/'+w):'https://wa.me/')+'?text='+encodeURIComponent(waText(r));
          window.open(u,'_blank');
          note(ok?'✅ نُسخت صورة الوصل وفُتحت محادثة '+(w?'الزبون':'واتساب')+' ورسالة التفعيل مكتوبة فيها.<br><b>اضغط Ctrl+V داخل المحادثة</b> فتظهر صورة الوصل ← أرسلها، ثم أرسل الرسالة.<br><button class="btn ghost small" data-cpi style="margin-top:6px">📋 نسخ الصورة مرة أخرى</button> <button class="btn ghost small" data-cpt style="margin-top:6px">📝 نسخ نص الرسالة</button>'
            :'✅ حُفظت صورة الوصل في «التنزيلات» وفُتحت محادثة '+(w?'الزبون':'واتساب')+'.<br>أرفق الصورة المحفوظة (📎) في المحادثة ثم أرسلها.');
          var b1=m.querySelector('[data-cpi]'); if(b1) b1.onclick=function(){ copyImg().then(function(k){ b1.textContent=k?'✅ نُسخت الصورة':'تعذر النسخ'; }); };
          var b3=m.querySelector('[data-cpt]'); if(b3) b3.onclick=function(){ copyTxt(waText(r)).then(function(k){ b3.textContent=k?'✅ نُسخ النص':'تعذر النسخ'; }); };
        });
      }
    };
    try{ db.ref('activation/accounts/'+key).update({receiptAt:firebase.database.ServerValue.TIMESTAMP,receiptNo:receiptNo(r)}); }catch(e){}
  });
};

<script>
/* ===== jadwal-admin v1 ===== */
(function(){
  'use strict';
  var JP='activation/jadwal/accounts';
  /* يجب أن تطابق سرّ برنامج الجدول حرفيًا */
  var SEC='MASOUDI-SCHEDULE-2026-HN';
  var ALPHA='23456789ABCDEFGHJKMNPQRSTUVWXYZ';
  var EPOCH=Date.UTC(2026,0,1);
  var LS_APP='daragat_admin_app';
  var PL={daily:{t:'D',d:1,l:'يومي'},monthly:{t:'M',d:30,l:'شهري'},yearly:{t:'Y',d:365,l:'سنوي'},permanent:{d:0,l:'دائم'}};
  var acc={}, tab='all', q='', started=false;

  /* ---------- مفاتيح مطابقة لبرنامج الجدول ---------- */
  function h32(s){ var h=0x811c9dc5; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0; } return h>>>0; }
  function wide(s,r){ var o='',x=s; for(var i=0;i<(r||4);i++){ x=s+'|'+i+'|'+h32(x+i); o+=('00000000'+h32(x).toString(16)).slice(-8); } return o.toUpperCase(); }
  function nk(s){ return String(s==null?'':s).replace(/[٠-٩]/g,function(d){return String(d.charCodeAt(0)-0x0660);}).replace(/[۰-۹]/g,function(d){return String(d.charCodeAt(0)-0x06F0);}).toUpperCase().replace(/[^0-9A-Z]/g,''); }
  function pick(h,n){ var o=''; for(var i=0;i<n;i++) o+=ALPHA[parseInt(h.substr(i*2,2),16)%ALPHA.length]; return o; }
  function permKey(dev){ return pick(wide(SEC+'#'+nk(dev)+'#'+SEC,5),16); }
  function enc31(n){ var s=''; for(var i=0;i<4;i++){ s=ALPHA[n%31]+s; n=Math.floor(n/31); } return s; }
  function timedKey(dev,t,expMs){ var body=t+enc31(Math.ceil((expMs-EPOCH)/3600000)); return 'T'+body+pick(wide(SEC+'#TIMED#'+nk(dev)+'#'+body+'#'+SEC,5),12); }
  /* مفتاح «ربط جهاز المعلم» (الجهاز الملحق) — مطابق لبرنامج الجدول */
  var JLS='JADWALI~QRLINK~HN2026';
  function qrlKey(dev){ return 'QRL'+pick(wide(JLS+'#QRLINK#'+nk(dev)+'#'+JLS,5),12); }
  function fmtQrl(k){ k=nk(k); return k.length===15?k.slice(0,3)+'-'+k.slice(3,7)+'-'+k.slice(7,11)+'-'+k.slice(11):k; }
  function keyFor(dev,plan,exp){ return plan==='permanent'?permKey(dev):timedKey(dev,PL[plan].t,exp); }
  function fmtKey(k){ k=nk(k); if(k.length===16) return k.replace(/(.{4})/g,'$1-').slice(0,-1); if(k.length===18) return k.slice(0,6)+'-'+k.slice(6,10)+'-'+k.slice(10,14)+'-'+k.slice(14); return k; }
  function fmtDev(d){ d=nk(d); return d.length===12?d.replace(/(.{4})/g,'$1-').slice(0,-1):d; }
  function expFor(plan){ return plan==='permanent'?0:Date.now()+PL[plan].d*86400000; }
  window.__jdKeys={permKey:permKey,timedKey:timedKey,keyFor:keyFor,qrlKey:qrlKey};

  /* ---------- أدوات ---------- */
  function E(s){ return esc(s); }
  function J(s){ return jsq(s); }
  function plab(p){ return (PL[p]||{}).l||p||'—'; }
  function TS(){ return firebase.database.ServerValue.TIMESTAMP; }
  function R(k){ return db.ref(JP+'/'+k); }
  function stopped(r){ return !!(r.accountDisabled||['suspended','deleted','cancelled'].indexOf(r.status)>=0); }
  function expired(r){ return r.status==='approved'&&r.plan!=='permanent'&&toTs(r.expiresAt)&&toTs(r.expiresAt)<Date.now(); }
  function stLabel(r){ if(stopped(r)) return 'موقوف'; if(expired(r)) return 'منتهي'; return {pending:'بانتظار الموافقة',approved:'مفعّل',rejected:'مرفوض',device_transfer_pending:'نقل جهاز'}[r.status]||r.status||'—'; }
  function stClass(r){ if(stopped(r)||r.status==='rejected'||expired(r)) return 'rejected'; if(r.status==='approved') return 'approved'; if(r.status==='device_transfer_pending') return 'conflict'; return 'pending'; }
  function list(){ return Object.keys(acc).map(function(k){ var v=acc[k]||{}; return Object.assign({key:k,email:v.email||k.replace(/,/g,'.')},v); }); }
  function waTo(phone,text){ var d=normIraqPhone(phone||''), w=waPhone(d); if(!/^07\d{9}$/.test(d)||!w) return ''; return 'https://wa.me/'+w+'?text='+encodeURIComponent(text||'السلام عليكم، بخصوص برنامج الجدول الأسبوعي الذكي'); }
  function pickV(btn,id){ var b=btn&&btn.closest&&btn.closest('tr,.acct-card'); var el=b?b.querySelector('#'+CSS.escape(id)):null; return (el||document.getElementById(id)||{value:''}).value; }

  /* ---------- الإجراءات ---------- */
  function setActive(k,plan,amount,isChange){
    var r=acc[k]||{}; var dev=r.deviceCode;
    if(!PL[plan]){ alert('اختر مدة صحيحة'); return; }
    if(!dev||nk(dev).length!==12){ alert('لا يوجد رمز جهاز صحيح لهذا الحساب'); return; }
    if(isChange && !confirm('تغيير اشتراك '+(r.schoolName||r.email)+' إلى: '+plab(plan)+'؟\nتبدأ المدة الجديدة من الآن.')) return;
    var exp=expFor(plan);
    var patch={status:'approved',accountDisabled:false,disabledReason:null,plan:plan,expiresAt:exp,licKey:keyFor(dev,plan,exp)};
    if(!r.approvedAt) patch.approvedAt=TS();
    if(isChange){ patch.planChangedAt=TS(); patch.previousPlan=r.plan||null; patch.previousExpiresAt=r.expiresAt||0; }
    if(amount!==undefined&&String(amount).trim()!=='') patch.paidAmount=String(amount).trim();
    R(k).update(patch).then(function(){ alert('✅ تم التفعيل: '+plab(plan)+(exp?'\nينتهي: '+fmtDate(exp):'')+'\nسيتفعّل البرنامج عند العميل تلقائيًا'); }).catch(function(e){ alert('❌ تعذر الحفظ: '+e.message); });
  }
  window.jdApprove=function(btn,k){ setActive(k,pickV(btn,'jdpl-'+k),pickV(btn,'jdpa-'+k),false); };
  window.jdChange=function(btn,k){ setActive(k,pickV(btn,'jdpl-'+k),pickV(btn,'jdpa-'+k),true); };
  window.jdQrl=function(k,on){
    var r=acc[k]||{}, dev=r.deviceCode;
    if(on){
      if(!dev||nk(dev).length!==12){ alert('لا يوجد رمز جهاز صحيح لهذا الحساب'); return; }
      if(!confirm('📲 تفعيل «ربط جهاز المعلم» (الجهاز الملحق) لـ '+(r.schoolName||r.email)+'؟\nيتفعّل عند العميل عند اتصاله بالإنترنت.')) return;
      R(k).update({qrlActive:true,qrlRevoked:null,qrlKey:qrlKey(dev),qrlAt:TS()}).then(function(){ alert('✅ تم تفعيل الجهاز الملحق'); }).catch(function(e){ alert(e.message); });
    }else{
      if(!confirm('إلغاء تفعيل «ربط جهاز المعلم» لهذا الحساب؟')) return;
      R(k).update({qrlActive:false,qrlRevoked:true,qrlKey:null,qrlRevokedAt:TS()}).catch(function(e){ alert(e.message); });
    }
  };
  window.jdReject=function(k){ if(!confirm('رفض طلب التفعيل؟')) return; R(k).update({status:'rejected'}); };
  window.jdStop=function(k){ if(!confirm('⏹ إيقاف الحساب؟\nيتوقف التوليد التلقائي عند العميل عند اتصاله بالإنترنت.')) return; R(k).update({status:'suspended',accountDisabled:true,disabledReason:'تم إيقاف الحساب من الإدارة',suspendedAt:TS()}).catch(function(e){ alert(e.message); }); };
  window.jdDel=function(k){ var r=acc[k]||{}; if(!confirm('🗑 حذف الحساب نهائيًا؟\n'+(r.email||k)+'\nيُرسل أولًا إيقاف للتطبيق ثم يُحذف السجل.')) return; var ref=R(k); ref.update({status:'suspended',accountDisabled:true,disabledReason:'تم حذف الحساب من الإدارة',deletedAt:TS()}).then(function(){ setTimeout(function(){ ref.remove().catch(function(){}); },700); }).catch(function(e){ alert(e.message); }); };
  window.jdTransferOk=function(k){
    var r=acc[k]||{}, nd=r.pendingDeviceCode;
    if(!nd){ alert('لا يوجد جهاز جديد في الطلب'); return; }
    var was=r.statusBeforeTransfer==='approved'||!!r.approvedAt||!!r.legacy;
    var plan=PL[r.plan]?r.plan:'monthly';
    if(!was && !confirm('⚠️ هذا الحساب لم يُفعَّل من قبل.\nالموافقة على النقل ستجعله مفعّلًا ('+plab(plan)+').\nمتابعة؟')) return;
    if(was && !confirm('✅ الموافقة على نقل الاشتراك للجهاز الجديد؟\nيتوقف الجهاز القديم عند اتصاله بالإنترنت.')) return;
    var exp=plan==='permanent'?0:(toTs(r.expiresAt)>Date.now()?toTs(r.expiresAt):expFor(plan));
    R(k).update({status:'approved',accountDisabled:false,disabledReason:null,plan:plan,expiresAt:exp,licKey:keyFor(nd,plan,exp),
      previousDeviceCode:r.deviceCode||null,deviceCode:nd,lastSeenDevice:r.pendingDeviceInfo||r.lastSeenDevice||null,
      pendingDeviceCode:null,pendingDeviceInfo:null,statusBeforeTransfer:null,transferApprovedAt:TS(),approvedAt:r.approvedAt||TS(),
      qrlKey:r.qrlActive?qrlKey(nd):null})
      .then(function(){ alert('✅ تم نقل الاشتراك'); }).catch(function(e){ alert(e.message); });
  };
  window.jdTransferNo=function(k){ var r=acc[k]||{}; if(!confirm('رفض طلب النقل؟')) return; R(k).update({status:r.statusBeforeTransfer||'pending',pendingDeviceCode:null,pendingDeviceInfo:null,statusBeforeTransfer:null}); };
  window.jdPaid=function(k,v){ R(k).update({paidAmount:String(v||'').trim()}); };
  window.jdPhone=function(k,v){ R(k).update({phone:normIraqPhone(v)}); };
  window.jdCopy=function(t,el){ try{ navigator.clipboard.writeText(t).then(function(){ var o=el.textContent; el.textContent='✅ نُسخ'; setTimeout(function(){ el.textContent=o; },1200); }); }catch(e){ prompt('انسخ:',t); } };

  /* ---------- العرض ---------- */
  function planOpts(sel){ return ['daily','monthly','yearly','permanent'].map(function(p){ return '<option value="'+p+'"'+(p===sel?' selected':'')+'>'+PL[p].l+'</option>'; }).join(''); }
  function row(r,i){
    var k=r.key, jk=J(k), ph=normIraqPhone(r.phone||''), wa=waTo(ph,'السلام عليكم، بخصوص تفعيل برنامج الجدول الأسبوعي الذكي'+(r.schoolName?' — '+r.schoolName:''));
    var isA=r.status==='approved'&&!stopped(r), isT=r.status==='device_transfer_pending', cur=PL[r.plan]?r.plan:'monthly';
    var d=r.lastSeenDevice||{};
    var school='<div class="at-school">'+E(r.schoolName||'—')+'</div><div class="at-sub"><span class="at-num">#'+(i+1)+'</span> <span class="badge-status s-'+stClass(r)+'">'+E(stLabel(r))+'</span>'+(r.source==='manual'?'<span class="jd-tag leg">تفعيل يدوي</span>':r.legacy?'<span class="jd-tag leg">مفعّل سابقًا</span>':'<span class="jd-tag onl">أونلاين</span>')+'</div>'
      +'<div class="at-sub">📅 التسجيل: '+E(fmtDate(toTs(r.registeredAt)||toTs(r.legacyRegisteredAt)))+(r.approvedAt?' · التفعيل: '+E(fmtDate(toTs(r.approvedAt))):'')+'</div>';
    var prin='<div class="at-strong">'+E(r.principalName||r.name||'—')+'</div>';
    var em='<span class="code at-ltr">'+E(r.email)+'</span>';
    var phone=(wa?'<a href="'+E(wa)+'" target="_blank" rel="noopener" class="btn whatsapp small">💬 '+E(ph)+'</a>':'<div class="at-warn">⚠️ لا يوجد هاتف</div>')
      +'<input type="tel" value="'+E(ph||r.phone||'')+'" placeholder="07xxxxxxxxx" class="inline at-ltr at-in" maxlength="11" onchange="jdPhone('+jk+',this.value)">';
    var dev='<div class="jd-dev">'+E(fmtDev(r.deviceCode))+'</div><div class="at-sub">'+E([d.type,d.os,d.browser].filter(Boolean).join(' · '))+'</div>'
      +(isT?'<div class="at-sub" style="color:var(--warnB);font-weight:900">⬅ الجهاز الجديد: <span class="jd-dev">'+E(fmtDev(r.pendingDeviceCode))+'</span></div>':'')
      +(r.lastSeenAt?'<div class="at-sub">آخر ظهور: '+E(fmtDate(toTs(r.lastSeenAt)))+'</div>':'');
    var plan;
    if(isA){
      var ex='';
      if(r.plan!=='permanent'&&r.expiresAt){ var dd=Math.ceil((toTs(r.expiresAt)-Date.now())/86400000); ex='<div class="at-sub '+(dd<0?'at-bad':dd<=7?'at-warn':'')+'">ينتهي: '+E(fmtDate(toTs(r.expiresAt)))+' ('+(dd<0?'منتهي':'باقي '+dd+' يوم')+')</div>'; }
      plan='<span class="badge-plan">'+E(plab(r.plan))+'</span>'+ex+(r.licKey?'<div><span class="jd-key" title="مفتاح هذا الجهاز — اضغط للنسخ" onclick="jdCopy('+J(fmtKey(r.licKey))+',this)">🔑 '+E(fmtKey(r.licKey))+'</span></div>':'');
    }else plan='';
    if(isA) plan+='<div style="margin-top:6px">'+(r.qrlActive?'<span class="jd-tag qrl-on">📲 الملحق مفعّل</span>'+(r.qrlKey?' <span class="jd-key" title="مفتاح الجهاز الملحق — اضغط للنسخ" onclick="jdCopy('+J(fmtQrl(r.qrlKey))+',this)">'+E(fmtQrl(r.qrlKey))+'</span>':''):'<span class="jd-tag qrl-off">📲 الملحق غير مفعّل</span>')+'</div>';
    plan+='<div class="at-plan"><select class="inline" id="jdpl-'+E(k)+'">'+planOpts(isA?cur:'permanent')+'</select><input type="text" id="jdpa-'+E(k)+'" value="'+E(r.paidAmount||'')+'" placeholder="المبلغ" class="inline at-ltr at-amt" onchange="jdPaid('+jk+',this.value)"></div>';
    var act='<div class="actions at-actions">'
      +(isT?'<button class="btn success small" onclick="jdTransferOk('+jk+')">✔ موافقة النقل</button><button class="btn danger small" onclick="jdTransferNo('+jk+')">✖ رفض النقل</button>'
        :isA?'<button class="btn warn small" onclick="jdChange(this,'+jk+')">⏱ تغيير المدة</button>'+(r.qrlActive?'<button class="btn ghost small" onclick="jdQrl('+jk+',false)">📲 إلغاء الملحق</button>':'<button class="btn violet small" onclick="jdQrl('+jk+',true)">📲 فعّل الجهاز الملحق</button>')
        :'<button class="btn success small" onclick="jdApprove(this,'+jk+')">✔ فعّل</button>'+(r.status==='pending'?'<button class="btn ghost small" onclick="jdReject('+jk+')">رفض</button>':''))
      +(!stopped(r)&&(isA||isT)?'<button class="btn warn small" onclick="jdStop('+jk+')">⏹ إيقاف</button>':'')
      +'<button class="btn danger small" onclick="jdDel('+jk+')">🗑 حذف</button></div>';
    return '<tr class="'+stClass(r)+'">'
      +'<td data-label="اسم المدرسة" class="at-head"><div class="at-v">'+school+'</div></td>'
      +'<td data-label="اسم المدير"><div class="at-v">'+prin+'</div></td>'
      +'<td data-label="الإيميل"><div class="at-v">'+em+'</div></td>'
      +'<td data-label="رقم الموبايل"><div class="at-v">'+phone+'</div></td>'
      +'<td data-label="رمز الجهاز"><div class="at-v">'+dev+'</div></td>'
      +'<td data-label="الاشتراك"><div class="at-v">'+plan+'</div></td>'
      +'<td data-label="الإجراءات" class="at-act"><div class="at-v">'+act+'</div></td></tr>';
  }
  function table(L,title){
    if(!L.length) return '<div class="card"><p class="muted">لا توجد سجلات.</p></div>';
    return '<div class="card"><div class="toolbar"><h3 class="card-title">'+E(title)+' <span class="count">'+L.length+'</span></h3><div class="grow"></div><button class="btn ghost small" onclick="jdCSV()">⬇ CSV</button></div>'
      +'<div class="acct-wrap"><table class="acct-tbl"><thead><tr><th>اسم المدرسة</th><th>اسم المدير</th><th>الإيميل</th><th>رقم الموبايل</th><th>رمز الجهاز</th><th>الاشتراك</th><th>الإجراءات</th></tr></thead><tbody>'
      +L.map(row).join('')+'</tbody></table></div></div>';
  }
  function match(r){
    if(!q) return true;
    var t=normAr(q), dq=t.replace(/[^0-9]/g,'');
    var hay=normAr([r.schoolName,r.principalName,r.name,r.email,r.phone,fmtDev(r.deviceCode),r.deviceCode,r.pendingDeviceCode].join(' '));
    if(hay.indexOf(t)>=0) return true;
    if(dq.length>=4 && digits(r.phone).indexOf(dq.replace(/^964/,'0'))>=0) return true;
    return false;
  }
  function digits(p){ return String(p||'').replace(/\D/g,''); }
  function renderKeygen(){
    return '<div class="card"><h3 class="card-title">🔑 توليد مفتاح الجدول (أوفلاين)</h3>'
      +'<p class="muted">أدخل رمز الجهاز الظاهر في برنامج الجدول (12 حرفًا) واختر المدة. المفتاح يعمل بدون إنترنت على هذا الجهاز فقط.</p>'
      +'<label>رمز الجهاز<input type="text" id="jdKgDev" dir="ltr" placeholder="XXXX-XXXX-XXXX" maxlength="20" style="text-align:center;letter-spacing:3px;font-family:monospace;font-size:16px"></label>'
      +'<label>نوع المفتاح<select id="jdKgType" onchange="document.getElementById(\'jdKgPlanBox\').style.display=this.value===\'qrl\'?\'none\':\'\'"><option value="main">تفعيل البرنامج</option><option value="qrl">📲 الجهاز الملحق (ربط جهاز المعلم — QRL)</option></select></label>'
      +'<label id="jdKgPlanBox">المدة<select id="jdKgPlan">'+planOpts('permanent')+'</select></label>'
      +'<div style="margin-top:14px"><button class="btn primary" onclick="jdGen()">🔓 توليد المفتاح</button></div><div id="jdKgOut"></div></div>';
  }
  window.jdGen=function(){
    var dev=nk($('jdKgDev').value), plan=$('jdKgPlan').value, isQ=$('jdKgType').value==='qrl';
    if(dev.length!==12){ alert('رمز الجهاز يجب أن يكون 12 حرفًا (مثل ABCD-EFGH-JKLM)'); return; }
    if(isQ){ var q=fmtQrl(qrlKey(dev)); $('jdKgOut').innerHTML='<p style="margin-top:14px;font-weight:800">مفتاح الجهاز الملحق (ربط جهاز المعلم):</p><div class="keybox" dir="ltr">'+E(q)+'</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="jdCopy('+J(q)+',this)">📋 نسخ</button><a class="btn whatsapp" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('مفتاح تفعيل ميزة «ربط جهاز المعلم» — تطبيق جدولي:\n'+q+'\n\nرمز الجهاز: '+fmtDev(dev))+'">📱 مشاركة واتساب</a></div>'; return; }
    var exp=expFor(plan), k=fmtKey(keyFor(dev,plan,exp));
    $('jdKgOut').innerHTML='<p style="margin-top:14px;font-weight:800">المفتاح ('+E(plab(plan))+(exp?' — ينتهي '+E(fmtDate(exp)):'')+'):</p><div class="keybox" id="jdKeyOut" dir="ltr">'+E(k)+'</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="jdCopy('+J(k)+',this)">📋 نسخ</button>'
      +'<a class="btn whatsapp" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('مفتاح تفعيل برنامج الجدول الأسبوعي الذكي ('+plab(plan)+'):\n'+k+'\n\nرمز الجهاز: '+fmtDev(dev))+'">📱 مشاركة واتساب</a></div>';
  };
  window.jdCSV=function(){
    var rows=[['#','email','schoolName','principalName','phone','deviceCode','status','source','plan','expiresAt','registeredAt','approvedAt','paidAmount','licKey','companion']];
    list().forEach(function(r,i){ rows.push([i+1,r.email,r.schoolName||'',r.principalName||'',normIraqPhone(r.phone||''),fmtDev(r.deviceCode),stLabel(r),r.source==='manual'?'تفعيل يدوي':r.legacy?'مفعّل سابقًا':'أونلاين',plab(r.plan),r.expiresAt?fmtDate(toTs(r.expiresAt)):'',fmtDate(toTs(r.registeredAt)),fmtDate(toTs(r.approvedAt)),r.paidAmount||'',fmtKey(r.licKey||''),r.qrlActive?'مفعّل':'']); });
    var csv=rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'})); a.download='jadwal-accounts-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  };
  function render(){
    var box=$('jdBody'); if(!box) return;
    var keep={}; box.querySelectorAll('select[id]').forEach(function(s){ keep[s.id]=s.value; });
    var all=list().sort(function(a,b){ return (toTs(b.requestedAt)||toTs(b.registeredAt)||toTs(b.legacyRegisteredAt))-(toTs(a.requestedAt)||toTs(a.registeredAt)||toTs(a.legacyRegisteredAt)); });
    var pen=all.filter(function(r){ return r.status==='pending'&&!stopped(r); }),
        tra=all.filter(function(r){ return r.status==='device_transfer_pending'&&!stopped(r); }),
        app=all.filter(function(r){ return r.status==='approved'&&!stopped(r)&&!r.legacy; }),
        leg=all.filter(function(r){ return r.legacy&&r.status==='approved'&&!stopped(r); }),
        stp=all.filter(function(r){ return stopped(r)||r.status==='rejected'; });
    /* ملخص التفعيل حسب المدة: الحسابات المفعّلة الآن (أونلاين + الموثّقون) دون الموقوفة */
    var actv=all.filter(function(r){ return r.status==='approved'&&!stopped(r); }),
        perm=actv.filter(function(r){ return r.plan==='permanent'; }),
        tmd=actv.filter(function(r){ return r.plan!=='permanent'&&!expired(r); }),
        exd=actv.filter(function(r){ return expired(r); });
    var C={all:all.length,pending:pen.length,transfers:tra.length,approved:app.length,legacy:leg.length,stopped:stp.length};
    Object.keys(C).forEach(function(k){ var b=$('jdB-'+k); if(b) b.textContent=C[k]; });
    $('jdStats').innerHTML='<div class="stat info"><div class="ic">🗓️</div><div class="num">'+all.length+'</div><div class="lbl">إجمالي حسابات الجدول</div></div>'
      +'<div class="stat warn"><div class="ic">📞</div><div class="num">'+pen.length+'</div><div class="lbl">بانتظار الموافقة</div></div>'
      +'<div class="stat tr"><div class="ic">🔄</div><div class="num">'+tra.length+'</div><div class="lbl">نقل أجهزة</div></div>'
      +'<div class="stat ok"><div class="ic">✅</div><div class="num">'+app.length+'</div><div class="lbl">مفعّلة أونلاين</div></div>'
      +'<div class="stat vio"><div class="ic">🛡️</div><div class="num">'+leg.length+'</div><div class="lbl">مفعّلون سابقًا (موثّقون)</div></div>'
      +'<div class="stat ok"><div class="ic">♾️</div><div class="num">'+perm.length+'</div><div class="lbl">مفعّل دائم</div></div>'
      +'<div class="stat info"><div class="ic">⏱️</div><div class="num">'+tmd.length+'</div><div class="lbl">مفعّل مؤقت'+(tmd.length?' <small style="display:block;font-size:11px;opacity:.85">'+['daily','monthly','yearly'].map(function(p){ var n=tmd.filter(function(r){ return r.plan===p; }).length; return n?plab(p)+' '+n:''; }).filter(Boolean).join(' · ')+'</small>':'')+'</div></div>'
      +'<div class="stat warn"><div class="ic">⌛</div><div class="num">'+exd.length+'</div><div class="lbl">مؤقت منتهي</div></div>';
    var html;
    if(tab==='keygen'){ if(!$('jdKgDev')) box.innerHTML=renderKeygen(); return; }
    var src={all:all,pending:pen,transfers:tra,approved:app,legacy:leg,stopped:stp}[tab]||all;
    var titles={all:'كل حسابات الجدول',pending:'طلبات التفعيل',transfers:'طلبات نقل الأجهزة',approved:'المفعّلة أونلاين',legacy:'المفعّلون سابقًا — سُجّلوا تلقائيًا',stopped:'الموقوفة والمرفوضة'};
    var L=src.filter(match);
    html=(q?'<p class="srch-why">نتائج البحث عن «<b>'+E(q)+'</b>»: '+L.length+'</p>':'')+table(L,titles[tab]||'');
    box.innerHTML=html;
    box.querySelectorAll('select[id]').forEach(function(s){ if(keep[s.id]!==undefined) s.value=keep[s.id]; });
  }
  function tabs(t){ tab=t; document.querySelectorAll('#jdTabs button').forEach(function(b){ b.classList.toggle('active',b.dataset.jd===t); }); if(t!=='keygen'||!$('jdKgDev')) $('jdBody').innerHTML=''; render(); }

  /* ---------- البناء والتبديل بين التطبيقين ---------- */
  function build(){
    var dash=$('dashPage'); if(!dash||$('jdWrap')) return;
    var h1=dash.querySelector('header h1');
    var sw=document.createElement('div'); sw.className='appsw'; sw.id='appSwitch';
    sw.innerHTML='<button type="button" data-app="daragat">🏫 الإدارة</button><button type="button" data-app="jadwal">🗓️ الجدول</button>';
    if(h1&&h1.parentNode) h1.parentNode.insertBefore(sw,h1.nextSibling);
    sw.addEventListener('click',function(e){ var b=e.target.closest('button[data-app]'); if(b) setApp(b.dataset.app); });
    var w=document.createElement('div'); w.id='jdWrap';
    w.innerHTML='<nav class="tabs jd-tabs" id="jdTabs">'
      +'<button data-jd="all" class="active">📋 الكل <span class="badge info" id="jdB-all">0</span></button>'
      +'<button data-jd="pending">📞 بانتظار الموافقة <span class="badge warn" id="jdB-pending">0</span></button>'
      +'<button data-jd="transfers">🔄 نقل جهاز <span class="badge warn" id="jdB-transfers">0</span></button>'
      +'<button data-jd="approved">✅ المفعّلة <span class="badge ok" id="jdB-approved">0</span></button>'
      +'<button data-jd="legacy">🛡️ المفعّلون سابقًا <span class="badge vio" id="jdB-legacy">0</span></button>'
      +'<button data-jd="stopped">⛔ الموقوفة <span class="badge" id="jdB-stopped">0</span></button>'
      +'<button data-jd="keygen">🔑 توليد مفتاح</button></nav>'
      +'<div class="srch"><span class="srch-ic">🔎</span><input type="search" id="jdSearch" autocomplete="off" placeholder="بحث: اسم المدرسة، الهاتف، البريد، رمز الجهاز…"></div>'
      +'<main><div class="stats" id="jdStats"></div><div id="jdBody"></div></main>';
    dash.appendChild(w);
    $('jdTabs').addEventListener('click',function(e){ var b=e.target.closest('button[data-jd]'); if(b) tabs(b.dataset.jd); });
    var t=0; $('jdSearch').addEventListener('input',function(){ clearTimeout(t); var v=this.value; t=setTimeout(function(){ q=v.trim(); render(); },150); });
    var saved=''; try{ saved=localStorage.getItem(LS_APP)||''; }catch(e){}
    setApp(saved==='jadwal'?'jadwal':'daragat');
  }
  function setApp(a){
    document.body.classList.toggle('jd-mode',a==='jadwal');
    document.querySelectorAll('#appSwitch button').forEach(function(b){ b.classList.toggle('on',b.dataset.app===a); });
    try{ localStorage.setItem(LS_APP,a); }catch(e){}
    if(a==='jadwal') start();
  }
  function start(){
    if(started||!db) return; started=true;
    $('jdBody').innerHTML='<div class="card"><p class="muted">جارٍ تحميل حسابات الجدول…</p></div>';
    db.ref(JP).on('value',function(s){ acc=s.val()||{}; render(); },function(e){
      $('jdBody').innerHTML='<div class="card"><p class="muted" style="color:var(--badB);font-weight:800">❌ تعذّر قراءة حسابات الجدول: '+E(e.message)+'<br>تأكد من إضافة قواعد «jadwal» في Firebase ← Realtime Database ← Rules.</p></div>';
    });
  }
  /* زر الإعدادات ⚙️ في الشريط العلوي يخص قسم الإدارة */
  document.addEventListener('click',function(e){ if(e.target.closest&&e.target.closest('header .hbtn.set')) setApp('daragat'); },true);
  /* ننتظر دخول الأدمن وتهيئة Firebase من قسم الإدارة دون تعديل كوده */
  var tries=0, iv=setInterval(function(){
    tries++;
    var ok=false; try{ ok=!!(db && $('dashPage') && $('dashPage').style.display!=='none'); }catch(e){}
    if(ok){ clearInterval(iv); build(); }
    else if(tries>600) clearInterval(iv);
  },300);
})();
</script>

</body>
</html>
