  --info:#7dd3fc;--infoB:#0284c7;--infoS:rgba(56,189,248,.12);--trial:#fde047;--trialB:#ca8a04;--trialS:rgba(250,204,21,.1);
  --hdr:linear-gradient(120deg,#050d26 0%,#0a1f5c 60%,#123a8c 100%);
  --sh:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.25);--sh2:0 20px 60px rgba(0,0,0,.6);
  --inBg:#0c1424;--hit:#854d0e;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:var(--bgGrad),var(--bg);background-attachment:fixed;color:var(--tx);min-height:100vh;transition:background-color .25s,color .25s;-webkit-font-smoothing:antialiased}
a{color:var(--pri)}
::selection{background:var(--priS)}

/* ========== Header ========== */
header{background:var(--hdr);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 6px 24px rgba(5,13,38,.35);position:relative;z-index:100}
header:after{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:linear-gradient(90deg,transparent,#f5b82e,transparent);opacity:.7}
header h1{margin:0;font-size:16px;font-weight:900;flex:1;min-width:200px;display:flex;align-items:center;gap:12px}
.brand-logo{width:42px;height:42px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 2px rgba(245,184,46,.35);flex:0 0 auto;object-fit:cover}
.brand-t{display:flex;flex-direction:column;line-height:1.35}
.brand-t small{font-size:11px;font-weight:700;color:#ffd76e;opacity:.95}
header .cfg{font-size:11.5px;font-weight:800;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:6px 12px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
header .hbtn{border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.09)!important;color:#fff!important;padding:8px 12px;border-radius:11px;font-weight:800;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,transform .05s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
header .hbtn:hover{background:rgba(255,255,255,.18)!important}
header .hbtn:active{transform:scale(.96)}
.hbtn.key{box-shadow:inset 0 -2px 0 #4ade80}
.hbtn.pass{box-shadow:inset 0 -2px 0 #c4b5fd}
.hbtn.set{box-shadow:inset 0 -2px 0 #7dd3fc}
.hbtn.logout{background:rgba(239,68,68,.22)!important;border-color:rgba(252,165,165,.4)!important}
.hbtn.logout:hover{background:rgba(239,68,68,.38)!important}
#themeBtn{min-width:40px;justify-content:center;font-size:15px}

/* ========== Tabs ========== */
nav.tabs{background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);display:flex;flex-wrap:nowrap;padding:6px 10px;position:sticky;top:0;z-index:90;overflow-x:auto;gap:4px;box-shadow:0 4px 14px rgba(16,24,40,.05);-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:1px solid transparent;padding:9px 13px;font-size:13px;font-weight:800;color:var(--tx2);cursor:pointer;border-radius:11px;white-space:nowrap;transition:background .15s,color .15s}
nav.tabs button:hover{background:var(--card2);color:var(--tx)}
nav.tabs button.active{color:var(--pri);background:var(--priS);border-color:color-mix(in srgb,var(--pri) 30%,transparent)}
nav.tabs button .badge{color:#fff;border-radius:10px;padding:1px 7px;font-size:10.5px;margin-right:5px;font-weight:900;display:inline-block;min-width:20px;text-align:center;background:var(--badB)}
nav.tabs button .badge.warn{background:var(--warnB)}
nav.tabs button .badge.ok{background:var(--okB)}
nav.tabs button .badge.info{background:var(--pri2)}
nav.tabs button .badge.vio{background:var(--vioB)}

/* ========== البحث الذكي ========== */
.srch{position:sticky;top:56px;z-index:89;display:flex;align-items:center;gap:8px;margin:12px auto 0;max-width:1376px;width:calc(100% - 24px);padding:6px 8px 6px 12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);transition:border-color .15s,box-shadow .15s}
.srch:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px var(--priS),var(--sh)}
.srch-ic{font-size:17px;opacity:.8}
.srch input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.srch input{flex:1;min-width:0;border:0!important;background:transparent!important;box-shadow:none!important;font-size:15px;padding:9px 4px!important;margin:0!important;color:var(--tx)}
.srch-x{border:0;background:var(--card2);color:var(--tx2);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:13px}
.srch-n{font-size:12.5px;font-weight:900;color:var(--pri);white-space:nowrap;background:var(--priS);padding:4px 10px;border-radius:20px}
.srch-n:empty{display:none}
.srch-hit{background:var(--hit);color:inherit;border-radius:3px;padding:0 1px}
.srch-why{font-size:12px;color:var(--tx2);margin:-4px 0 10px}
.srch-why b{color:var(--pri)}

/* ========== Main ========== */
main{padding:14px 12px 40px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--bd)}
.card-title{font-size:15.5px;font-weight:900;color:var(--tx);margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-title .count{background:var(--priS);color:var(--pri);padding:2px 11px;border-radius:20px;font-size:12px}
.card-title .note{font-size:11.5px;color:var(--mut);font-weight:400}

/* ========== Login ========== */
.login-wrap{max-width:410px;margin:0 auto;padding:max(48px,9vh) 16px 30px;min-height:100vh}
.login-wrap .card{padding:30px 24px 24px;border-radius:24px;box-shadow:var(--sh2);position:relative;overflow:hidden}
.login-wrap .card:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,#1747b5,#f5b82e,#1747b5)}
.login-wrap h2{text-align:center;color:var(--tx);margin:0 0 6px;font-size:21px;font-weight:900}
.login-wrap .logo{text-align:center;margin:0 auto 12px;width:84px;height:84px;border-radius:22px;overflow:hidden;box-shadow:0 12px 30px rgba(10,36,98,.35),0 0 0 4px rgba(245,184,46,.2);font-size:0}
.login-wrap .logo img{width:100%;height:100%;display:block}
.login-wrap .sub{text-align:center;color:var(--mut);font-size:13px;margin:0 0 18px}
.login-theme{position:fixed;top:14px;left:14px;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:17px;cursor:pointer;box-shadow:var(--sh);z-index:5}

/* ========== Forms ========== */
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--bd2);border-radius:12px;font-family:inherit;font-size:14px;margin-top:6px;background:var(--inBg);color:var(--tx);transition:border-color .15s,box-shadow .15s,background .15s}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);background:var(--card);box-shadow:0 0 0 4px var(--priS)}
label{font-size:12.5px;font-weight:800;color:var(--tx2);display:block;margin-top:12px}
button{font-family:inherit}
.btn{border:none;padding:8px 14px;border-radius:10px;font-weight:800;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;transition:transform .05s,filter .15s,box-shadow .15s;white-space:nowrap;text-decoration:none;line-height:1.3}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 30%,transparent)}
.btn.success{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff}
.btn.violet{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff}
.btn.whatsapp{background:#25D366;color:#fff;padding:5px 10px;font-size:11.5px}
.btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
.btn.ghost{background:var(--card2);color:var(--tx2);border:1px solid var(--bd)}
.btn.ghost:hover{background:var(--priS);color:var(--pri);filter:none}
.btn.small{padding:6px 10px;font-size:11.5px;border-radius:9px}
.btn.block{width:100%;padding:13px;border-radius:13px;font-size:14.5px;justify-content:center}

/* ========== Toolbar ========== */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar .card-title{margin:0}
.toolbar .grow{flex:1}

/* ========== Table ========== */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;border:1px solid var(--bd)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:900px}
th,td{padding:11px 12px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:middle}
th{background:var(--card2);font-weight:900;color:var(--tx2);font-size:11.5px;white-space:nowrap;letter-spacing:.2px}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--card2)}
tbody tr:last-child td{border-bottom:0}
tr.trial td:first-child{box-shadow:inset -4px 0 0 var(--trialB)}
tr.pending td:first-child{box-shadow:inset -4px 0 0 var(--warnB)}
tr.approved td:first-child{box-shadow:inset -4px 0 0 var(--okB)}
tr.rejected td:first-child{box-shadow:inset -4px 0 0 var(--badB)}
tr.conflict td:first-child{box-shadow:inset -4px 0 0 var(--infoB)}
tr.reset-pw td:first-child{box-shadow:inset -4px 0 0 var(--vioB)}
tr.pending{background:color-mix(in srgb,var(--warnS) 60%,transparent)}
tr.rejected{background:color-mix(in srgb,var(--badS) 55%,transparent)}
tr.reset-pw{background:color-mix(in srgb,var(--vioS) 60%,transparent)}
tr.conflict{background:color-mix(in srgb,var(--infoS) 55%,transparent)}
td .actions{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-start}
td .mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
input.inline,select.inline{width:auto;display:inline-block;padding:6px 9px;font-size:12px;margin:2px 2px 2px 0;min-width:70px;border-radius:9px}

/* ========== Cards view for mobile ========== */
.cards-view{display:none}
.acct-card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.acct-card.conflict{border-right:4px solid var(--infoB)}
.acct-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.acct-card .email{font-family:monospace;direction:ltr;font-size:11.5px;background:var(--card2);color:var(--tx);padding:3px 8px;border-radius:6px;word-break:break-all;display:inline-block}
.acct-card .name{font-weight:900;font-size:14px;color:var(--tx);margin-top:4px}
.acct-card .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;margin:6px 0}
.acct-card .meta b{color:var(--mut);font-weight:800}
.acct-card .actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}

/* ========== Badges ========== */
.badge-status{padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:900;display:inline-flex;align-items:center;gap:4px;border:1px solid transparent}
.badge-status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.s-trial{background:var(--trialS);color:var(--trial)}
.s-pending{background:var(--warnS);color:var(--warn)}
.s-approved{background:var(--okS);color:var(--ok)}
.s-rejected,.s-expired{background:var(--badS);color:var(--bad)}
.s-conflict,.s-device_transfer_pending{background:var(--infoS);color:var(--info)}
.s-reset-pw,.s-password_reset{background:var(--vioS);color:var(--vio)}
.s-suspended,.s-disabled,.s-deleted,.s-cancelled{background:var(--badS);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.badge-plan{background:var(--priS);color:var(--pri);padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:900;display:inline-block;margin:1px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;background:var(--card2);color:var(--tx);border:1px solid var(--bd);padding:2px 7px;border-radius:6px;font-size:11px}
.keybox{direction:ltr;text-align:center;letter-spacing:3px;font-family:monospace;font-size:22px;font-weight:900;background:var(--okS);color:var(--ok);border:1px dashed color-mix(in srgb,var(--ok) 45%,transparent);padding:16px;border-radius:14px;margin:12px 0;word-break:break-all}
.muted{color:var(--mut);font-size:12px}
.devicetag{display:inline-block;background:var(--card2);color:var(--tx2);border:1px solid var(--bd);padding:2px 7px;border-radius:7px;font-size:10.5px;margin:1px}
.cfgbox{background:var(--vioS);padding:12px;border-radius:12px;font-size:12px;color:var(--vio);word-break:break-all;margin-top:10px}
.hint{background:var(--goldS);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:12px;padding:11px 12px;margin-top:14px;font-size:12.5px;color:var(--tx2);line-height:1.8}
.phone-input{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.phone-input a{flex-shrink:0}

/* ========== Modal ========== */
.modal-bg{position:fixed;inset:0;background:rgba(5,13,38,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:22px;max-width:420px;width:100%;box-shadow:var(--sh2);animation:mIn .25s ease}
@keyframes mIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 10px;color:var(--tx)}

/* ========== Stats ========== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{--c:var(--pri);--cs:var(--priS);background:var(--card);border-radius:16px;padding:14px 16px;border:1px solid var(--bd);box-shadow:var(--sh);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;inset:auto auto -30px -30px;width:90px;height:90px;border-radius:50%;background:var(--cs);opacity:.8}
body.admin-dark .stat:after{opacity:.45}
.stat .ic{grid-row:1/3;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:var(--cs);position:relative;z-index:1}
.stat .num{font-size:26px;font-weight:900;color:var(--c);line-height:1.1;position:relative;z-index:1}
.stat .lbl{font-size:11.5px;color:var(--mut);font-weight:800;position:relative;z-index:1}
.stat.warn{--c:var(--warnB);--cs:var(--warnS)}
.stat.ok{--c:var(--okB);--cs:var(--okS)}
.stat.vio{--c:var(--vioB);--cs:var(--vioS)}
.stat.trial{--c:var(--trialB);--cs:var(--trialS)}
.stat.info{--c:var(--pri);--cs:var(--priS)}
.stat.tr{--c:var(--infoB);--cs:var(--infoS)}

/* ========== Responsive ========== */
@media(max-width:760px){
  header{padding:10px 12px}
  header h1{font-size:14px;min-width:100%}
  .brand-logo{width:36px;height:36px;border-radius:10px}
  header .hbtn{padding:7px 10px;font-size:11.5px}
  nav.tabs{padding:5px 6px}
  nav.tabs button{padding:8px 10px;font-size:12px}
  .srch{top:50px;width:calc(100% - 12px);margin-top:8px}
  main{padding:10px 6px 30px}
  .card{padding:13px;border-radius:15px}
  .tbl-wrap{display:none}
  .cards-view{display:block}
  th,td{padding:6px 5px;font-size:11px}
  .login-wrap .card{padding:26px 16px 20px}
  .stats{grid-template-columns:repeat(3,1fr);gap:7px}
  .stat{padding:10px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border-radius:14px}
  .stat .ic{display:none}
  .stat:after{display:none}
  .stat{border-top:3px solid var(--c)}
  .stat .num{font-size:21px}
  .stat .lbl{font-size:10.5px}
}

/* ========== جدول الحسابات (موحّد للحاسوب والهاتف) ========== */
.acct-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;border:1px solid var(--bd)}
table.acct-tbl{min-width:1000px;table-layout:auto}
table.acct-tbl th{position:sticky;top:0;z-index:1}
table.acct-tbl td{vertical-align:top}
table.acct-tbl th:nth-child(1){min-width:170px}
table.acct-tbl th:nth-child(7){min-width:190px}
.at-school{font-weight:900;color:var(--tx);font-size:13.5px}
.at-strong{font-weight:800}
.at-sub{font-size:10.5px;color:var(--mut);margin-top:4px}
.at-num{font-weight:900;color:var(--mut);margin-left:4px}
.at-ltr{direction:ltr;unicode-bidi:plaintext}
.at-copy{cursor:pointer;background:var(--goldS)!important;color:var(--tx)!important;border-color:color-mix(in srgb,var(--gold) 40%,transparent)!important}
.at-warn{font-size:10.5px;color:var(--warn);font-weight:800}
.at-bad{color:var(--bad);font-weight:800}
.at-in{width:130px!important;max-width:100%;margin-top:5px;display:block!important}
.at-plan{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.at-amt{width:90px!important;flex:0 0 auto}
.at-plan select{width:auto!important;flex:0 0 auto}
.at-actions{display:flex;flex-wrap:wrap;gap:4px}
.at-v{min-width:0}
.at-v .badge-plan{display:inline-block}
@media(max-width:760px){
  .acct-wrap{border:0;overflow:visible}
  table.acct-tbl,table.acct-tbl tbody{display:block;min-width:0;width:100%}
  table.acct-tbl thead{display:none}
  table.acct-tbl tr{display:block;border:1px solid var(--bd);border-radius:15px;margin-bottom:10px;padding:4px 12px;box-shadow:var(--sh);background:var(--card)}
  table.acct-tbl tr.trial{border-right:4px solid var(--trialB)}table.acct-tbl tr.pending{border-right:4px solid var(--warnB)}table.acct-tbl tr.approved{border-right:4px solid var(--okB)}
  table.acct-tbl tr.rejected{border-right:4px solid var(--badB)}table.acct-tbl tr.conflict{border-right:4px solid var(--infoB)}table.acct-tbl tr.reset-pw{border-right:4px solid var(--vioB)}
  table.acct-tbl tr td:first-child{box-shadow:none}
  table.acct-tbl td{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start;padding:8px 0;font-size:12px;border-bottom:1px dashed var(--bd)}
  table.acct-tbl td:last-child{border-bottom:0}
  table.acct-tbl td::before{content:attr(data-label);font-weight:800;color:var(--mut);font-size:11.5px;padding-top:2px}
  table.acct-tbl td.at-head{grid-template-columns:1fr;border-bottom:1px solid var(--bd)}
  table.acct-tbl td.at-head::before{display:none}
  table.acct-tbl td.at-head .at-school{font-size:15px}
  table.acct-tbl td.at-act{grid-template-columns:1fr}
  table.acct-tbl td.at-act::before{display:none}
  .code.at-ltr{word-break:break-all}
  .at-in{width:100%!important;max-width:200px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<!-- ====== LOGIN ====== -->
<div id="loginPage" class="login-wrap">

/* ====== البحث الذكي في الحسابات ====== */
function normAr(t){
  return String(t==null?"":t)
    .replace(/[\u0660-\u0669]/g,d=>String(d.charCodeAt(0)-0x0660)).replace(/[\u06F0-\u06F9]/g,d=>String(d.charCodeAt(0)-0x06F0))
    .replace(/[\u064B-\u0652\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .toLowerCase().replace(/\s+/g," ").trim();
}
function phoneDigits(p){ const d=normAr(p).replace(/[^0-9]/g,""); return d?normIraqPhone(d):""; }
let adSearchQ="";
function adSearchFields(r){
  return [
    ["الهاتف",r.phone],["المدرسة",r.schoolName],["المدير",r.principalName],["اسم الحساب",r.name],["البريد",r.email],
    ["المرحلة",r.schoolStage?stageLabel(r.schoolStage):""],["الحالة",statusLabel(r.status)],["الاشتراك",r.plan||r.planCode?planLabel(r.plan||r.planCode):""],
    ["المبلغ",r.paidAmount],["المحافظة",r.governorate||r.city||r.province||""]
  ];
}
function adSearchMatch(r,q){
  const toks=normAr(q).split(" ").filter(Boolean); if(!toks.length) return null;
  const f=adSearchFields(r), why=new Set(); let score=0;
  for(const t of toks){
    let ok=false; const dig=t.replace(/[^0-9]/g,"");
    if(dig.length>=3&&dig.length===t.length){ /* رقم: يُطابق الهاتف بأي صيغة (07.. أو 964.. أو جزء منه) */
      const pd=phoneDigits(r.phone), qd=normIraqPhone(dig), qn=dig.replace(/^0+/,"");
      if(pd&&(pd.includes(dig)||pd.includes(qd)||(qn.length>=3&&pd.includes(qn)))){ ok=true; why.add("الهاتف"); score+=pd===qd?100:40; }
    }
    if(!ok){ for(const [lab,val] of f){ const v=normAr(val); if(v&&v.includes(t)){ ok=true; why.add(lab); score+=(v===t?30:(v.startsWith(t)?20:10)); break; } } }
    if(!ok) return null;
  }
  return {score,why:[...why]};
}
function highlightIn(html,q){
  const toks=normAr(q).split(" ").filter(t=>t.length>=2&&!/^[0-9]+$/.test(t)); if(!toks.length) return html;
  return html.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>{ if(tag) return tag;
    let out=txt; if(txt.indexOf('&')>=0) return txt; toks.forEach(t=>{ const src=out, ns=normAr(src); if(ns.length!==src.toLowerCase().length) return; const i=ns.indexOf(t); if(i>=0) out=src.slice(0,i)+'<mark class="srch-hit">'+src.slice(i,i+t.length)+'</mark>'+src.slice(i+t.length); });
    return out; });
}

  document.querySelectorAll(".tab").forEach(t=>t.style.display="none");
  box.style.display="block";
  box.innerHTML=hits.length
    ? '<div class="srch-why">البحث عن «<b>'+esc(q)+'</b>» — وُجد في: <b>'+esc(why.join("، "))+'</b></div>'+highlightIn(renderTable(hits.map(h=>h.r),"🔎 نتائج البحث ("+hits.length+")"),q)
    : '<div class="card"><p class="muted">لا يوجد زبون يطابق «'+esc(q)+'». جرّب جزءاً من الرقم أو من اسم المدرسة أو المدير.</p></div>';
}
let adSearchT=0;
function onAdSearch(){ clearTimeout(adSearchT); adSearchT=setTimeout(()=>{ adSearchQ=($("adSearch")||{}).value||""; renderAdSearch(); bindRowInputs($("tab-search")); },120); }
function clearAdSearch(){ const i=$("adSearch"); if(i) i.value=""; adSearchQ=""; renderAdSearch(); if(i) i.focus(); }
function bindRowInputs(root){
  if(!root) return;
  root.querySelectorAll("input[data-paid-for]").forEach(inp=>{ if(inp.__b) return; inp.__b=1; inp.addEventListener("change",()=>setPaid(inp.dataset.paidFor,inp.value)); });
  root.querySelectorAll("input[data-phone-for]").forEach(inp=>{ if(inp.__b) return; inp.__b=1; inp.addEventListener("change",()=>setPhone(inp.dataset.phoneFor,inp.value)); });
}
document.addEventListener("keydown",e=>{ if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"")){ const i=$("adSearch"); if(i&&i.offsetParent){ e.preventDefault(); i.focus(); } } });

function switchTab(name){
  if(adSearchQ){ adSearchQ=""; const i=$("adSearch"); if(i) i.value=""; const b=$("tab-search"); if(b){ b.style.display="none"; b.innerHTML=""; } const n=$("adSearchN"); if(n) n.textContent=""; const x=$("adSearchX"); if(x) x.style.display="none"; }
  currentTab=name;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
  document.querySelectorAll(".tab").forEach(t=>t.style.display="none");
  const el=$("tab-"+name);
  if(el)el.style.display="block";
  if(name==="settings")renderSettings();
  if(name==="keygen")renderKeygen();
}
document.addEventListener("click",e=>{const b=e.target.closest("nav.tabs button[data-tab]");if(b)switchTab(b.dataset.tab);});

function deviceBadges(r){
  const d=r.lastSeenDevice||{};
  let h="";
  const type=d.type||"?";
  const os=d.os||"";
  const br=d.browser||"";
  const bv=d.browserVersion||"";
  const brand=d.brand||"";
  const sc=d.screen||"";
  const label = d.label || ((brand?brand+" ":"")+type+" - "+os+(br?" / "+br+(bv?" "+bv.split(".")[0]:""):""));
  h+='<span class="devicetag" title="'+esc(label)+(sc?" — "+sc:"")+'">📱 '+esc(type)+'</span>';
  if(brand)h+='<span class="devicetag" title="'+esc(os)+'">🏷 '+esc(brand)+'</span>';
  if(os)h+='<span class="devicetag">💿 '+esc(os)+'</span>';
  if(br)h+='<span class="devicetag">🌐 '+esc(br)+(bv?" "+esc(bv.split(".")[0]):"")+'</span>';
  if(sc)h+='<span class="devicetag" title="الشاشة">🖥 '+esc(sc)+'</span>';
  return h;
}
function lastDevId(r){return r.lastSeenDevice&&r.lastSeenDevice.id?r.lastSeenDevice.id:"-";}

function renderStats(all,trial,pending,approved,transfers,resets){
  $("statsBox").innerHTML=`
    <div class="stat info"><div class="ic">🏫</div><div class="num">${all.length}</div><div class="lbl">إجمالي الحسابات</div></div>
    <div class="stat trial"><div class="ic">🆓</div><div class="num">${trial.length}</div><div class="lbl">تجريبية</div></div>
    <div class="stat warn"><div class="ic">📞</div><div class="num">${pending.length}</div><div class="lbl">طلبات تفعيل</div></div>
    <div class="stat tr"><div class="ic">🔄</div><div class="num">${transfers.length}</div><div class="lbl">نقل أجهزة</div></div>
    <div class="stat vio"><div class="ic">🔑</div><div class="num">${resets.length}</div><div class="lbl">استعادة كلمة سر</div></div>
    <div class="stat ok"><div class="ic">✅</div><div class="num">${approved.length}</div><div class="lbl">مُفعّلة</div></div>`;
}

function pickIn(btn,id){
  // نفس الحساب يظهر في أكثر من تبويب (الكل/الطلبات/المفعّلة) بنفس المعرّف،
  // لذلك نقرأ القيمة من نفس الصف/البطاقة التي ضُغط فيها الزر وليس أول عنصر في الصفحة.
  const box=(btn&&btn.closest&&btn.closest("tr,.acct-card"))||document;
  const el=Array.from(box.querySelectorAll("select,input")).find(e=>e.id===id)||document.getElementById(id);
  return el||{value:""};
}
function renderAll(){
  const keep={};
  document.querySelectorAll('[id^="tab-"] select[id]').forEach(el=>{
    const tab=el.closest('[id^="tab-"]');keep[(tab?tab.id:"")+"|"+el.id]=el.value;
  });
  const recs=Object.entries(allAccounts).map(([k,v])=>({emailKey:k,email:(v.email||k.replace(/,/g,".")),...v}));
  recs.sort((a,b)=>{const ta=a.registeredAt||0,tb=b.registeredAt||0;return tb-ta;});
  const all=[],trial=[],pending=[],approved=[],transfers=[],resets=[];
  for(const r of recs){
    all.push(r);
    if(r.status==="approved") approved.push(r);
    else if(r.status==="device_transfer_pending") transfers.push(r);
    else if(r.status==="pending") pending.push(r);
    else if(r.passwordResetRequestedAt) resets.push(r);
    else if(["suspended","disabled","deleted","cancelled"].includes(r.status)){}
    else trial.push(r);
  }
  $("bAll").textContent=all.length;
  $("bTrial").textContent=trial.length;
  $("bPen").textContent=pending.length;
  $("bApp").textContent=approved.length;
  $("bTra").textContent=transfers.length;
  $("bRes").textContent=resets.length;
  renderStats(all,trial,pending,approved,transfers,resets);
  $("tab-all").innerHTML=renderTable(all,"كل الحسابات");
  $("tab-trial").innerHTML=renderTable(trial,"الفترة التجريبية");
  $("tab-pending").innerHTML=renderTable(pending,"طلبات التفعيل");
  $("tab-approved").innerHTML=renderTable(approved,"الحسابات المُفعّلة");
  $("tab-transfers").innerHTML=renderTransfersTable(transfers,"طلبات نقل الأجهزة");
  $("tab-reset").innerHTML=renderTable(resets,"🔑 طلبات استعادة كلمة السر");
  if(adSearchQ) renderAdSearch();
  document.querySelectorAll('[id^="tab-"] select[id]').forEach(el=>{
    const tab=el.closest('[id^="tab-"]');const v=keep[(tab?tab.id:"")+"|"+el.id];
    if(v!==undefined && Array.from(el.options).some(o=>o.value===v))el.value=v;
  });
  document.querySelectorAll("input[data-paid-for]").forEach(inp=>{
    inp.addEventListener("change",()=>setPaid(inp.dataset.paidFor,inp.value));
  });
  document.querySelectorAll("input[data-phone-for]").forEach(inp=>{
    inp.addEventListener("change",()=>setPhone(inp.dataset.phoneFor,inp.value));
  });
}

function renderTransfersTable(list,title){
  if(!list.length)return `<div class="card"><p class="muted">لا توجد طلبات حالياً.</p></div>`;
  const rows=list.map(r=>`
    <tr class="conflict">
      <td><span class="code">${esc(r.email)}</span></td>
      <td>${esc(r.name||"-")}</td>
      <td>${deviceBadges(r)}</td>
      <td><span class="code" style="font-size:10px">${esc(lastDevId(r).slice(0,12))}…</span></td>
      <td>${fmtDate(r.transferRequestedAt)}</td>
      <td><span class="code" style="font-size:10px">${esc((r.activeDeviceId||"-").slice(0,8))}…</span></td>
      <td><div class="actions">
        <button class="btn success small" onclick="approveTransfer(${jsq(r.email)})">✔ موافقة</button>
        <button class="btn danger small" onclick="rejectTransfer(${jsq(r.email)})">✖ رفض</button>
      </div></td>
    </tr>`).join("");
  const cards=list.map(r=>`
    <div class="acct-card conflict">
      <div class="top"><span class="email">${esc(r.email)}</span><span class="badge-status s-conflict">نقل جهاز</span></div>
      <div class="name">${esc(r.name||"-")}</div>
      <div class="meta">
        <b>الجهاز:</b><span>${deviceBadges(r)}</span>
        <b>تاريخ:</b><span>${fmtDate(r.transferRequestedAt)}</span>
      </div>
      <div class="actions">
        <button class="btn success" onclick="approveTransfer(${jsq(r.email)})">✔ موافقة النقل</button>
        <button class="btn danger" onclick="rejectTransfer(${jsq(r.email)})">✖ رفض</button>
      </div>
    </div>`).join("");
  return `<div class="card">
    <div class="toolbar"><h3 class="card-title">${esc(title)} <span class="count">${list.length}</span><span class="note"> — الجهاز القديم يتوقف عند الموافقة</span></h3></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>البريد</th><th>الاسم</th><th>الجهاز</th><th>المعرّف</th><th>التاريخ</th><th>الجهاز الحالي</th><th>إجراء</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="cards-view">${cards}</div>
  </div>`;
}

function renderTable(list,title){
  if(!list.length)return `<div class="card"><p class="muted">لا توجد سجلات.</p></div>`;

  const statusClass=r=>{
    if(r.status==="approved"&&r.plan!=="permanent"&&r.expiresAt&&r.expiresAt<Date.now())return "rejected";
    if(r.passwordResetRequestedAt)return "reset-pw";
    if(r.status==="approved")return "approved";
    if(r.status==="pending")return "pending";
    if(r.status==="device_transfer_pending")return "conflict";
    if(r.status==="rejected")return "rejected";
    if(["suspended","disabled","deleted","cancelled"].includes(r.status))return "rejected";
    return "trial";
  };
  const planOptions=sel=>[["weekly","أسبوع"],["monthly","شهر"],["yearly","سنة"],["permanent","دائم"]]
    .map(([v,l])=>`<option value="${v}" ${sel===v?"selected":""}>${l}</option>`).join("");

  const rows=list.map((r,i)=>{
    const cls=statusClass(r);
    const email=esc(r.email);
    const emEsc=email.replace(/'/g,"\\'");
    const jsEm=jsq(r.email), jsKey=jsq(r.emailKey), jsPw=jsq(r.password||"");
    const jsChg=jsq('chg-'+(r.emailKey||'')), jsPa=jsq('pa-'+(r.emailKey||'')), jsPl=jsq('pl-'+(r.emailKey||''));
    const keyEsc=esc(r.emailKey).replace(/'/g,"\\'");
    const k=esc(r.emailKey);
    const pw=r.password||"";
    const pwEsc=esc(pw).replace(/'/g,"\\'");
    const phone=normIraqPhone(r.phone||"");
    const isApproved=r.status==="approved";
    const isReset=r.passwordResetRequestedAt;
    const isStopped=["suspended","disabled","deleted","cancelled"].includes(r.status);
    const currentPlan=normalizePlan(r.plan||r.planCode)||"monthly";
    const schoolSub=[r.schoolStage?stageLabel(r.schoolStage):"",r.schoolGender?genderLabel(r.schoolGender):""].filter(Boolean).map(esc).join(" - ");

    /* 1) المدرسة */
    const schoolCell=`<div class="at-school">${esc(r.schoolName||"—")}</div>
      ${schoolSub?`<div class="at-sub">${schoolSub}</div>`:""}
      <div class="at-sub"><span class="at-num">#${i+1}</span>
        <span class="badge-status s-${String(r.status||"trial").replace(/[^A-Za-z0-9_-]/g,"")}">${statusLabel(r.status)}</span>${isReset?' <span class="badge-status s-reset-pw">🔑 استعادة</span>':""}
      </div>`;

    /* 2) المدير */
    const principalCell=`<div class="at-strong">${esc(r.principalName||r.name||"—")}</div>
      ${r.principalName&&r.name&&r.name!==r.principalName?`<div class="at-sub">${esc(r.name)}</div>`:""}`;

    /* 3) الإيميل */
    const emailCell=`<span class="code at-ltr">${email}</span>${r.authProvider==="google"?'<div class="at-sub">🟢 حساب Google</div>':""}${(r.deviceReleasedAt&&!r.activeDeviceId)?'<div class="at-sub">🔓 سجّل الخروج من جهازه — ينتقل لأول جهاز يدخل</div>':""}`;

    /* 4) كلمة السر */
    const pwCell=pw
      ? `<span class="code at-ltr at-copy" title="اضغط للنسخ" onclick="navigator.clipboard&&navigator.clipboard.writeText(${jsPw}).then(()=>{this.textContent='✅ تم النسخ';setTimeout(()=>{this.textContent=${jsPw}},1200)},()=>{})">${esc(pw)}</span>`
      : '<span class="muted at-sub">غير محفوظ</span>';

    /* 5) الموبايل */
    const phoneOk=/^07[0-9]{9}$/.test(phone);
    const phoneCell=`${phoneOk?`<a href="${waLink(phone)}" target="_blank" class="btn whatsapp small">💬 ${esc(phone)}</a>`:'<div class="at-warn">⚠️ لم يُدخل الهاتف</div>'}
      <input type="tel" data-phone-for="${email}" value="${phoneOk?esc(phone):esc(r.phone||"")}" placeholder="07xxxxxxxxx" class="inline at-ltr at-in" maxlength="11" />`;

    /* 6) مدة التفعيل */
    let planCell;
    if(isApproved){
      let exp="";
      if(currentPlan!=="permanent"&&r.expiresAt){
        const d=Math.ceil((r.expiresAt-Date.now())/86400000);
        exp=`<div class="at-sub ${d<0?"at-bad":d<=7?"at-warn":""}">ينتهي: ${fmtDate(r.expiresAt)} (${d<0?"منتهي":"باقي "+d+" يوم"})</div>`;
      }
      planCell=`<span class="badge-plan">${planLabel(r.plan||r.planCode)}</span>${exp}
        <div class="at-plan"><select class="inline" id="chg-${k}">${planOptions(currentPlan)}</select>
        <input type="text" id="pa-${k}" data-paid-for="${email}" value="${esc(r.paidAmount||"")}" placeholder="المبلغ" class="inline at-ltr at-amt" /></div>`;
    }else{
      planCell=`<div class="at-plan"><select class="inline" id="pl-${k}">${planOptions("monthly")}</select>
        <input type="text" id="pa-${k}" data-paid-for="${email}" value="${esc(r.paidAmount||"")}" placeholder="المبلغ" class="inline at-ltr at-amt" /></div>`;
    }

    /* 7) الإجراءات */
    const actions=`<div class="actions at-actions">
      ${isApproved
        ?`<button class="btn warn small" onclick="changePlan(${jsKey},pickIn(this,${jsChg}).value,pickIn(this,${jsPa}).value)">⏱ تغيير المدة</button>`
        :`<button class="btn success small" onclick="approve(${jsEm},pickIn(this,${jsPl}).value,pickIn(this,${jsPa}).value)">✔ فعّل</button>`}
      ${r.status!=="rejected"&&!isReset?`<button class="btn ghost small" onclick="reject(${jsEm})">رفض</button>`:""}
      ${isReset
        ?`<button class="btn violet small" onclick="resetPassword(${jsEm})">🔑 إرسال الرمز</button><button class="btn ghost small" onclick="clearReset(${jsEm})" title="إلغاء الطلب">✕</button>`
        :`<button class="btn violet small" onclick="resetPassword(${jsEm})" title="استعادة كلمة السر">🔑</button>`}
      ${!isStopped?`<button class="btn warn small" onclick="stopAccount(${jsEm})">⏹ إيقاف</button>`:""}
      <button class="btn danger small" onclick="del(${jsEm})">🗑 حذف</button>
    </div>`;

    return `<tr class="${cls}">
      <td data-label="اسم المدرسة" class="at-head"><div class="at-v">${schoolCell}</div></td>
      <td data-label="اسم المدير"><div class="at-v">${principalCell}</div></td>
      <td data-label="الإيميل"><div class="at-v">${emailCell}</div></td>
      <td data-label="الرقم السري"><div class="at-v">${pwCell}</div></td>
      <td data-label="رقم الموبايل"><div class="at-v">${phoneCell}</div></td>
      <td data-label="مدة التفعيل"><div class="at-v">${planCell}</div></td>
      <td data-label="الإجراءات" class="at-act"><div class="at-v">${actions}</div></td>
    </tr>`;
  }).join("");

  return `<div class="card">
    <div class="toolbar">
      <h3 class="card-title">${esc(title)} <span class="count">${list.length}</span></h3>
      <div class="grow"></div>
      <button class="btn ghost small" onclick="exportCSV()">⬇ CSV</button>
    </div>
    <div class="acct-wrap"><table class="acct-tbl">
      <thead><tr>
        <th>اسم المدرسة</th><th>اسم المدير</th><th>الإيميل</th><th>الرقم السري</th><th>رقم الموبايل</th><th>مدة التفعيل</th><th>الإجراءات</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function renderKeygen(){
  $("tab-keygen").innerHTML=`<div class="card">
    <h3 class="card-title">🔑 توليد مفتاح أوفلاين</h3>
    <p class="muted">أدخل معرّف الجهاز ونوع الاشتراك لتوليد مفتاح مرتبط بالجهاز (يعمل بدون إنترنت).</p>
    <label>معرّف الجهاز
      <input type="text" id="kgDev" dir="ltr" placeholder="A1B2C3D8" style="text-align:center;letter-spacing:3px;font-family:monospace;font-size:16px" maxlength="16" />
    </label>
    <label>نوع الاشتراك
      <select id="kgPlan">
        <option value="weekly">أسبوعي (7 أيام)</option>
        <option value="monthly" selected>شهري (30 يوم)</option>
        <option value="yearly">سنوي (365 يوم)</option>
        <option value="permanent">دائم</option>
      </select>
    </label>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" onclick="genKey()">🔓 توليد المفتاح</button>
    </div>
    <div id="kgResult"></div>
  </div>`;
}
function genKey(){
  const dev=$("kgDev").value.trim().toUpperCase().replace(/[^0-9A-F]/g,"");
  const plan=$("kgPlan").value;
  if(dev.length<6){alert("أدخل معرّف جهاز صحيح (الحروف+الأرقام الظاهرة في التطبيق)");return;}
  const k=offSig(dev,plan);
  $("kgResult").innerHTML=`<p style="margin-top:14px;font-weight:700">المفتاح (${planLabel(plan)}):</p>
    <div class="keybox" id="keyOut">${k}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('keyOut').textContent).then(()=>alert('تم النسخ'))">📋 نسخ</button>
      <a class="btn whatsapp" href="https://wa.me/?text=${encodeURIComponent('المفتاح: '+k)}" target="_blank">📱 مشاركة واتساب</a>
    </div>`;
}

function renderSettings(){
  $("tab-settings").innerHTML=`<div class="card">
    <h3 class="card-title">⚙️ الإعدادات</h3>
    <label>إعداد Firebase (JSON):
      <textarea id="sFb" dir="ltr" rows="7" style="font-family:monospace;font-size:12px;text-align:left;direction:ltr"></textarea>
    </label>
    <label>السر المشترك (مفاتيح الأوفلاين):
      <input type="text" id="sSec" dir="ltr" />
    </label>
    <div class="hint">
      💡 لتغيير كلمة سر الأدمن استخدم زر <b>🔒 تغيير كلمة السر</b> في الشريط العلوي (يتطلب كلمة السر الحالية).
    </div>
    <div style="margin-top:14px"><button class="btn primary" onclick="saveSettings()">💾 حفظ الإعدادات</button></div>
  </div>`;
  $("sFb").value=JSON.stringify(cfg.firebase,null,2);
  $("sSec").value=SECRET;
}
function saveSettings(){
  try{
    const t=($("sFb").value||"").trim();
    let fb=cfg.firebase;
    if(t){try{fb=JSON.parse(t);}catch(e){alert("JSON غير صحيح");return;}}
    cfg.firebase=fb;
    const sk=$("sSec").value.trim();
    if(sk){cfg.secret=sk;SECRET=sk;}
    saveCfgObj(cfg);
    alert("✅ تم الحفظ. سيتم إعادة التحميل.");location.reload();
  }catch(e){alert(e.message);}
}

function exportCSV(){
  const recs=Object.entries(allAccounts).map(([k,v])=>({emailKey:k,email:(v.email||k.replace(/,/g,".")),...v}));
  const rows=[["#","email","password","name","schoolName","schoolStage","schoolGender","principalName","phone","device_type","device_brand","device_os","device_browser","device_browser_version","device_screen","device_id","status","plan","registeredAt","approvedAt","expiresAt","paidAmount"]];
  recs.forEach((r,i)=>{
    const d=r.lastSeenDevice||{};
    rows.push([
      i+1,r.email,r.password||"",r.name||"",r.schoolName||"",stageLabel(r.schoolStage),genderLabel(r.schoolGender),r.principalName||"",
      normIraqPhone(r.phone||""),
      d.type||"",d.brand||"",d.os||"",d.browser||"",d.browserVersion||"",d.screen||"",d.id||"",
      r.status||"trial",r.plan||"",r.registeredAt||"",r.approvedAt||"",r.expiresAt||"",r.paidAmount||""
    ]);
  });
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="daragat-accounts-"+new Date().toISOString().slice(0,10)+".csv";a.click();
}

function goDash(){
  $("loginPage").style.display="none";
  $("dashPage").style.display="block";
  if(!initFB()){switchTab("settings");return;}
  listenAccounts();
  switchTab("all");
}
document.getElementById("loginPass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
if(localStorage.getItem(LS_SES)==="1") goDash();
