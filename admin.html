<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم التفعيل - الاداره المدرسيه</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:#f1f3f6;color:#222}
header{background:linear-gradient(135deg,#1a237e,#283593);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;flex:1;min-width:200px}
header .cfg{font-size:12px;opacity:.8}
header button{background:#ef5350;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}
nav.tabs{background:#fff;border-bottom:1px solid #ddd;display:flex;flex-wrap:wrap;padding:0 12px;position:sticky;top:0;z-index:5;overflow-x:auto}
nav.tabs button{background:none;border:none;padding:12px 14px;font-size:14px;font-weight:700;color:#555;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.active{color:#1a237e;border-bottom-color:#1a237e}
nav.tabs button .badge{background:#ef5350;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-right:6px}
nav.tabs button .badge.warn{background:#ff9800}
nav.tabs button .badge.ok{background:#2e7d32}
nav.tabs button .badge.info{background:#1976d2}
main{padding:18px;max-width:1300px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px #00000012}
.login-wrap{max-width:420px;margin:60px auto}
.login-wrap h2{text-align:center;color:#1a237e}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cfd4dc;border-radius:8px;font-family:inherit;font-size:14px;margin-top:6px}
label{font-size:13px;font-weight:700;color:#444;display:block;margin-top:10px}
button.primary{background:#1a237e;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer}
button.success{background:#2e7d32;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}
button.warn{background:#ef6c00;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}
button.whatsapp{background:#25D366;color:#fff;border:none;padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;text-decoration:none;display:inline-block}
button.danger{background:#c62828;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}
button.ghost{background:#eceff1;color:#333;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
th,td{padding:7px 8px;border:1px solid #e0e3e8;text-align:right;vertical-align:middle}
th{background:#f4f6fa;font-weight:700}
tr.trial{background:#fffde7}
tr.pending{background:#fff3e0}
tr.approved{background:#e8f5e9}
tr.rejected{background:#ffebee}
tr.conflict{background:#e3f2fd}
.badge-plan{background:#e3f2fd;color:#0d47a1;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.badge-status{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.s-trial{background:#fff9c4;color:#827717}
.s-pending{background:#ffe0b2;color:#bf360c}
.s-approved{background:#c8e6c9;color:#1b5e20}
.s-rejected{background:#ffcdd2;color:#b71c1c}
.s-conflict{background:#bbdefb;color:#0d47a1}
.code{font-family:monospace;direction:ltr;background:#f6f8fa;padding:2px 6px;border-radius:4px;font-size:11px}
.keybox{direction:ltr;text-align:center;letter-spacing:3px;font-family:monospace;font-size:20px;font-weight:800;background:#e8f5e9;color:#1b5e20;padding:12px;border-radius:10px;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:680px){.grid2{grid-template-columns:1fr}table{font-size:11px}th,td{padding:4px 5px}}
.muted{color:#777;font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.cfgbox{background:#ede7f6;padding:12px;border-radius:10px;font-size:12px;color:#4527a0;word-break:break-all;margin-top:10px}
.devicetag{display:inline-block;background:#eceff1;color:#37474f;padding:1px 7px;border-radius:6px;font-size:11px;margin-left:4px}
</style>
</head>
<body>

<div id="loginPage" class="login-wrap">
  <div class="card">
    <h2>🔐 دخول لوحة التحكم</h2>
    <label>كلمة السر
      <input type="password" id="loginPass" placeholder="أدخل كلمة سر الأدمن" />
    </label>
    <div style="margin-top:14px"><button class="primary" onclick="doLogin()" style="width:100%">دخول</button></div>
    <p class="muted" style="margin-top:12px;text-align:center">كلمة السر الافتراضية: <span class="code">hsm@2026</span></p>
    <p class="muted" style="text-align:center"><a href="#" onclick="showCfg(event)">الإعدادات</a></p>
    <div id="cfgPanel" class="card" style="display:none;padding:12px;margin-top:14px">
      <h3 style="margin:0 0 6px">⚙️ إعدادات Firebase</h3>
      <p class="muted">الصق كائن firebaseConfig هنا. يُحفظ محلياً فقط.</p>
      <textarea id="cfgJson" dir="ltr" rows="8" style="font-family:monospace;font-size:12px;text-align:left;direction:ltr"></textarea>
      <label>كلمة سر الأدمن الجديدة:
        <input type="password" id="newAdminPass" placeholder="اتركه فارغاً" />
      </label>
      <label>السر المشترك (مفاتيح الأوفلاين):
        <input type="text" id="secKey" value="HSM-DARAGAT-2026-V1" />
      </label>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="primary" onclick="saveCfg()">حفظ</button>
        <button class="ghost" onclick="document.getElementById('cfgPanel').style.display='none'">إغلاق</button>
      </div>
    </div>
  </div>
</div>

<div id="dashPage" style="display:none">
  <header>
    <h1>🎛️ لوحة تحكم التفعيل - الاداره المدرسيه</h1>
    <span class="cfg" id="fbStatus">جاري الاتصال…</span>
    <button onclick="logout()">خروج</button>
  </header>
  <nav class="tabs">
    <button data-tab="all" class="active">الكل <span class="badge info" id="bAll">0</span></button>
    <button data-tab="trial">🆓 التجريبي <span class="badge" id="bTrial">0</span></button>
    <button data-tab="pending">📞 يريد التفعيل <span class="badge warn" id="bPen">0</span></button>
    <button data-tab="transfers">🔄 نقل أجهزة <span class="badge warn" id="bTra">0</span></button>
    <button data-tab="approved">✅ المفعّلة <span class="badge ok" id="bApp">0</span></button>
    <button data-tab="keygen">🔑 مفتاح أوفلاين</button>
    <button data-tab="settings">⚙️ الإعدادات</button>
  </nav>
  <main>
    <div id="tab-all" class="tab"></div>
    <div id="tab-trial" class="tab" style="display:none"></div>
    <div id="tab-pending" class="tab" style="display:none"></div>
    <div id="tab-transfers" class="tab" style="display:none"></div>
    <div id="tab-approved" class="tab" style="display:none"></div>
    <div id="tab-keygen" class="tab" style="display:none"></div>
    <div id="tab-settings" class="tab" style="display:none"></div>
  </main>
</div>

<script>
const LS_CFG="daragat_admin_cfg_v2";
const LS_SES="daragat_admin_ses";
let db=null, SECRET="HSM-DARAGAT-2026-V1";

const DEFAULT_FIREBASE={
  apiKey:"AIzaSyAyPSUK_8kOGGCBc2fy1pPNSOzBtwenMi0",
  authDomain:"daragat.firebaseapp.com",
  databaseURL:"https://daragat-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"daragat",
  storageBucket:"daragat.firebasestorage.app",
  messagingSenderId:"123733341266",
  appId:"1:123733341266:web:fce19012a0781f96b29b8b"
};

function hash32(str){
  let h=0x811c9dc5>>>0;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0;}
  return (h>>>0).toString(16).padStart(8,"0");
}
function offSig(dev,plan){const b=SECRET+"|"+dev+"|"+plan;const h1=hash32(b),h2=hash32(b+"|chk");return (h1+h2).toUpperCase().match(/.{1,4}/g).join("-");}
function planDays(p){return{weekly:7,monthly:30,yearly:365,permanent:99999}[p]||0;}
function planLabel(p){return{weekly:"أسبوعي",monthly:"شهري",yearly:"سنوي",permanent:"دائم"}[p]||p||"-";}
function statusLabel(s){return{trial:"تجريبي",pending:"ينتظر التفعيل",approved:"مُفعّلة",rejected:"مرفوض",expired:"منتهية"}[s]||s||"-";}
function fmtDate(ts){if(!ts)return"-";try{return new Date(ts).toLocaleString("ar-IQ");}catch(e){return String(ts);}}
function $(id){return document.getElementById(id);}
function stageLabel(st){return {elementary:"ابتدائية",intermediate:"متوسطة",prep:"إعدادية"}[st]||st||"-";}
function genderLabel(g){return {boys:"بنين",girls:"بنات",mixed:"مختلطة"}[g]||g||"-";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function loadCfg(){try{return JSON.parse(localStorage.getItem(LS_CFG)||"null")||{};}catch(e){return {};}}
function saveCfgObj(c){
  try{localStorage.setItem(LS_CFG,JSON.stringify(c));}
  catch(e){
    const keep=[LS_CFG,LS_SES];
    Object.keys(localStorage).filter(k=>!keep.includes(k)).forEach(k=>{try{localStorage.removeItem(k);}catch(_){}});
    localStorage.setItem(LS_CFG,JSON.stringify(c));
  }
}
let cfg=loadCfg();
if(!cfg.firebase) cfg.firebase={...DEFAULT_FIREBASE};
else {for(const k in DEFAULT_FIREBASE){if(!cfg.firebase[k])cfg.firebase[k]=DEFAULT_FIREBASE[k];}}
if(cfg.secret) SECRET=cfg.secret; else SECRET="HSM-DARAGAT-2026-V1";
let adminHash=cfg.adminHash||"65a4456f";

function showCfg(e){if(e)e.preventDefault();$("cfgPanel").style.display="block";}
function saveCfg(){
  try{
    const t=($("cfgJson")?($("cfgJson").value||"").trim():"");
    let fb=cfg.firebase;
    if(t){try{fb=JSON.parse(t);}catch(e){alert("JSON غير صحيح");return;}}
    cfg.firebase=fb;
    const np=$("newAdminPass").value;
    if(np&&np.length>=4){cfg.adminHash=hash32(np);adminHash=cfg.adminHash;}
    const sk=$("secKey").value.trim();
    if(sk){cfg.secret=sk;SECRET=sk;}
    saveCfgObj(cfg);
    alert("✅ تم الحفظ");location.reload();
  }catch(e){alert(e.message);}
}

function doLogin(){
  const p=$("loginPass").value;
  if(hash32(p)===adminHash){localStorage.setItem(LS_SES,"1");goDash();}
  else alert("كلمة السر غير صحيحة");
}
function logout(){localStorage.removeItem(LS_SES);location.reload();}


function initFB(){
  try{
    if(typeof firebase==="undefined"){$("fbStatus").innerHTML="⚠️ لم يتصل Firebase";return false;}
    firebase.initializeApp(cfg.firebase);
    db=firebase.database();
    $("fbStatus").textContent="✅ متصل بـ "+cfg.firebase.projectId;
    return true;
  }catch(e){$("fbStatus").textContent="❌ خطأ: "+e.message;return false;}
}

let allAccounts={};
function listenAccounts(){
  db.ref("activation/accounts").on("value",snap=>{
    allAccounts=snap.val()||{};
    renderAll();
  });
}

function approve(email, plan, amount){
  const emailKey=email.replace(/\./g,",");
  const days=planDays(plan);
  db.ref("activation/accounts/"+emailKey).update({
    status:"approved",
    plan:plan,
    approvedAt:firebase.database.ServerValue.TIMESTAMP,
    expiresAt:Date.now()+days*86400000,
    paidAmount:amount||""
  });
}
function approveTransfer(email){
  if(!confirm("الموافقة على نقل الاشتراك للجهاز الجديد؟ (سيتم إيقاف الجهاز القديم)"))return;
  const k=email.replace(/\./g,",");
  db.ref("activation/accounts/"+k).once("value",snap=>{
    const v=snap.val()||{};
    const plan=v.plan||"monthly";
    db.ref("activation/accounts/"+k).update({
      status:"approved",
      plan:plan,
      approvedAt:v.approvedAt||firebase.database.ServerValue.TIMESTAMP,
      expiresAt:v.expiresAt||(Date.now()+30*86400000)
    });
  });
}
function rejectTransfer(email){
  if(!confirm("رفض طلب النقل؟ (سيبقى الاشتراك على الجهاز القديم)"))return;
  const k=email.replace(/\./g,",");
  db.ref("activation/accounts/"+k).update({status:"approved"});
}
function reject(email){
  if(!confirm("تأكيد رفض هذا الطلب؟"))return;
  const k=email.replace(/\./g,",");
  db.ref("activation/accounts/"+k).update({status:"rejected"});
}
function del(email){
  if(!confirm("حذف هذا الحساب نهائياً؟"))return;
  db.ref("activation/accounts/"+email.replace(/\./g,",")).remove();
}
function setPaid(email,amount){
  db.ref("activation/accounts/"+email.replace(/\./g,",")).update({paidAmount:amount});
}
function setPhone(email,phone){
  db.ref("activation/accounts/"+email.replace(/\./g,",")).update({phone:phone});
}
function waLink(phone){
  let p=String(phone||"").replace(/[^0-9]/g,"");
  if(!p) return "#";
  if(p.startsWith("0"))p="964"+p.slice(1);
  return "https://wa.me/"+p+"?text="+encodeURIComponent("السلام عليكم، بخصوص تفعيل تطبيق الاداره المدرسيه");
}

function switchTab(name){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
  document.querySelectorAll(".tab").forEach(t=>t.style.display="none");
  $("tab-"+name).style.display="block";
  if(name==="settings"){renderSettings();}
  if(name==="keygen"){renderKeygen();}
}
document.addEventListener("click",e=>{const b=e.target.closest("nav.tabs button[data-tab]");if(b)switchTab(b.dataset.tab);});

function renderAll(){
  const recs=Object.entries(allAccounts).map(([k,v])=>({emailKey:k,email:(v.email||k.replace(/,/g,".")),...v}));
  recs.sort((a,b)=>{
    const ta=a.registeredAt||0,tb=b.registeredAt||0; return tb-ta;
  });
  const today=new Date();today.setHours(0,0,0,0);const todayMs=today.getTime();
  const all=[],trial=[],pending=[],approved=[],transfers=[];
  for(const r of recs){
    all.push(r);
    if(r.status==="approved") approved.push(r);
    else if(r.status==="device_transfer_pending") transfers.push(r);
    else if(r.status==="pending") pending.push(r);
    else trial.push(r);
  }
  $("bAll").textContent=all.length;
  $("bTrial").textContent=trial.length;
  $("bPen").textContent=pending.length;
  $("bApp").textContent=approved.length;
  $("bTra").textContent=transfers.length;
  $("tab-all").innerHTML=renderTable(all,"كل الحسابات");
  $("tab-trial").innerHTML=renderTable(trial,"فترة تجريبية");
  $("tab-pending").innerHTML=renderTable(pending,"طلبات التفعيل (بانتظار التواصل)");
  $("tab-approved").innerHTML=renderTable(approved,"الحسابات المُفعّلة");
  $("tab-transfers").innerHTML=renderTransfersTable(transfers,"طلبات نقل الجهاز");
  document.querySelectorAll("input[data-paid-for]").forEach(inp=>{
    inp.addEventListener("change",()=>setPaid(inp.dataset.paidFor,inp.value));
  });
  document.querySelectorAll("input[data-phone-for]").forEach(inp=>{
    inp.addEventListener("change",()=>setPhone(inp.dataset.phoneFor,inp.value));
  });
}

function deviceBadges(r){
  const d=r.lastSeenDevice||{};
  return `<span class="devicetag">💻 ${esc(d.type||"?")}</span><span class="devicetag">${esc(d.os||"")}</span><span class="devicetag">${esc(d.browser||"")}</span>`;
}
function lastDevId(r){
  return r.lastSeenDevice&&r.lastSeenDevice.id?r.lastSeenDevice.id:"-";
}
function renderTransfersTable(list,title){
  if(!list.length)return '<div class="card"><p class="muted">لا توجد طلبات نقل حالياً.</p></div>';
  const rows=list.map(r=>{
    return '<tr class="conflict"><td><span class="code" dir="ltr">'+esc(r.email)+'</span></td>' +
      '<td>'+esc(r.name||"-")+'</td>'+
      '<td>'+esc(r.lastSeenDevice&&r.lastSeenDevice.type||"?")+' / '+esc(r.lastSeenDevice&&r.lastSeenDevice.os||"")+'</td>'+
      '<td><span class="code" dir="ltr" style="font-size:10px">'+esc(r.lastSeenDevice&&r.lastSeenDevice.id||"-")+'</span></td>'+
      '<td>'+fmtDate(r.transferRequestedAt||r.registeredAt)+'</td>'+
      '<td><span class="code" dir="ltr" style="font-size:10px">'+esc(r.activeDeviceId?r.activeDeviceId.slice(0,8)+"...":"-")+'</span></td>'+
      '<td style="min-width:180px">'+
        '<button class="success" onclick="approveTransfer(\''+esc(r.email).replace(/'/g,"\\'")+'\')">✔ موافقة النقل</button> '+
        '<button class="danger" onclick="rejectTransfer(\''+esc(r.email).replace(/'/g,"\\'")+'\')">✖ رفض</button>'+
      '</td></tr>';
  }).join("");
  return '<div class="card"><div class="toolbar"><strong>'+esc(title)+' ('+list.length+')</strong>'+
    '<span class="muted"> — الجهاز القديم يتوقف عند الموافقة</span></div>'+
    '<div style="overflow:auto"><table><thead><tr>'+
    '<th>البريد</th><th>الاسم</th><th>الجهاز الجديد</th><th>معرّف الجهاز الجديد</th><th>تاريخ الطلب</th><th>الجهاز الفعّال</th><th>إجراء</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function renderTable(list,title){
  if(!list.length)return `<div class="card"><p class="muted">لا توجد سجلات.</p></div>`;
  const rows=list.map(r=>{
    let cls="trial";
    if(r.status==="approved") cls="approved";
    else if(r.status==="pending") cls="pending";
    else if(r.status==="device_transfer_pending") cls="conflict";
    else if(r.status==="rejected") cls="rejected";
    const expLabel = r.approvedPlan&&r.approvedPlan!=="permanent"&&r.expiresAt?fmtDate(r.expiresAt):(r.plan==="permanent"?"دائم":"—");
    const isExp = r.status==="approved" && r.plan!=="permanent" && r.expiresAt && r.expiresAt<Date.now();
    if(isExp) cls="rejected";
    return `<tr class="${cls}">
      <td><span class="code" dir="ltr">${esc(r.email)}</span></td>
      <td>${esc(r.schoolStage?stageLabel(r.schoolStage):"")} ${esc(r.schoolGender?genderLabel(r.schoolGender):"")}</td>
      <td>${esc(r.name||"-")}</td>
      <td><a href="${waLink(r.phone)}" target="_blank" class="whatsapp" dir="ltr">${esc(r.phone||"-")} 💬</a>
        <input type="text" data-phone-for="${esc(r.email)}" value="${esc(r.phone||"")}" placeholder="رقم الهاتف" style="width:110px;display:inline-block;padding:3px;font-size:11px;direction:ltr" />
      </td>
      <td>${deviceBadges(r)}</td>
      <td><span class="code" dir="ltr" style="font-size:10px">${esc(lastDevId(r))}</span></td>
      <td>${fmtDate(r.registeredAt)}</td>
      <td><span class="badge-status s-${r.status||"trial"}">${statusLabel(r.status)}</span></td>
      <td>${r.status==="approved"?`<span class="badge-plan">${planLabel(r.plan)}</span>`:`
        <select id="pl-${esc(r.emailKey)}" style="width:auto;display:inline-block;padding:3px;font-size:11px">
          <option value="weekly">أسبوعي</option><option value="monthly" selected>شهري</option>
          <option value="yearly">سنوي</option><option value="permanent">دائم</option>
        </select>
        <button class="success" onclick="approve('${esc(r.email).replace(/'/g,"\\'")}',document.getElementById('pl-${esc(r.emailKey)}').value,document.getElementById('pa-${esc(r.emailKey)}').value)">✔ موافقة</button>`}
      </td>
      <td><input type="text" id="pa-${esc(r.emailKey)}" data-paid-for="${esc(r.email)}" value="${esc(r.paidAmount||"")}" placeholder="المبلغ" style="width:90px;display:inline-block;padding:3px;font-size:11px;direction:ltr" /></td>
      <td style="min-width:140px">
        ${r.status==="approved"?`<select id="ext-${esc(r.emailKey)}" style="width:auto;display:inline-block;padding:3px;font-size:11px"><option value="weekly">أسبوعي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option><option value="permanent">دائم</option></select>
        <button class="warn" onclick="approve('${esc(r.email).replace(/'/g,"\\'")}',document.getElementById('ext-${esc(r.emailKey)}').value,document.getElementById('pa-${esc(r.emailKey)}').value)">↻ تجديد</button>`:""}
        ${r.status!=="rejected"?` <button class="ghost" onclick="reject('${esc(r.email).replace(/'/g,"\\'")}')">رفض</button>`:""}
        <button class="danger" onclick="del('${esc(r.email).replace(/'/g,"\\'")}')">🗑</button>
      </td>
    </tr>`;
  }).join("");
  return `<div class="card">
    <div class="toolbar"><strong>${title} (${list.length})</strong>
      <button class="ghost" onclick="exportCSV()">⬇ تصدير CSV</button>
    </div>
    <div style="overflow:auto"><table>
      <thead><tr>
        <th>البريد</th><th>الاسم</th><th>المدرسة</th><th>الهاتف</th><th>الجهاز</th><th>معرّف الجهاز</th><th>تاريخ التسجيل</th><th>الحالة</th><th>الخطة</th><th>المبلغ</th><th>إجراءات</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function renderKeygen(){
  $("tab-keygen").innerHTML=`<div class="card">
    <h3>🔑 توليد مفتاح أوفلاين</h3>
    <p class="muted">أدخل معرّف الجهاز ونوع الاشتراك لتوليد مفتاح مرتبط بالجهاز.</p>
    <label>معرّف الجهاز
      <input type="text" id="kgDev" dir="ltr" placeholder="A1B2C3D8" style="text-align:center;letter-spacing:2px;font-family:monospace" />
    </label>
    <label>نوع الاشتراك
      <select id="kgPlan">
        <option value="weekly">أسبوعي (7 أيام)</option>
        <option value="monthly" selected>شهري (30 يوم)</option>
        <option value="yearly">سنوي</option>
        <option value="permanent">دائم</option>
      </select>
    </label>
    <div style="margin-top:14px"><button class="primary" onclick="genKey()">توليد المفتاح</button></div>
    <div id="kgResult"></div>
  </div>`;
}
function genKey(){
  const dev=$("kgDev").value.trim().toUpperCase().replace(/[^0-9A-F]/g,"");
  const plan=$("kgPlan").value;
  if(dev.length<6){alert("أدخل معرّف جهاز صحيح");return;}
  const k=offSig(dev,plan);
  $("kgResult").innerHTML=`<p style="margin-top:14px;font-weight:700">المفتاح (${planLabel(plan)}):</p>
    <div class="keybox" id="keyOut">${k}</div>
    <button class="ghost" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('keyOut').textContent)">📋 نسخ</button>`;
}

function renderSettings(){
  $("tab-settings").innerHTML=`<div class="card">
    <h3>⚙️ الإعدادات</h3>
    <label>Firebase JSON:
      <textarea id="sFb" dir="ltr" rows="8" style="font-family:monospace;font-size:12px;text-align:left;direction:ltr"></textarea>
    </label>
    <label>تغيير كلمة السر:
      <input type="password" id="sPass" />
    </label>
    <label>السر المشترك (مفاتيح الأوفلاين):
      <input type="text" id="sSec" />
    </label>
    <div style="margin-top:14px"><button class="primary" onclick="saveSettings()">💾 حفظ</button></div>
  </div>`;
  $("sFb").value=JSON.stringify(cfg.firebase,null,2);
  $("sSec").value=SECRET;
}
function saveSettings(){
  try{
    const t=($("sFb").value||"").trim();
    let fb=cfg.firebase;
    if(t){try{fb=JSON.parse(t);}catch(e){alert("JSON غير صحيح");return;}}
    cfg.firebase=fb;
    const np=$("sPass").value;
    if(np&&np.length>=4){cfg.adminHash=hash32(np);adminHash=cfg.adminHash;}
    const sk=$("sSec").value.trim();
    if(sk){cfg.secret=sk;SECRET=sk;}
    saveCfgObj(cfg);
    alert("✅ تم الحفظ. سيتم إعادة التحميل.");location.reload();
  }catch(e){alert(e.message);}
}

function exportCSV(){
  const recs=Object.entries(allAccounts).map(([k,v])=>({emailKey:k,email:(v.email||k.replace(/,/g,".")),...v}));
  const rows=[["email","name","phone","device_type","device_os","device_browser","device_id","status","plan","registeredAt","approvedAt","expiresAt","paidAmount"]];
  recs.forEach(r=>rows.push([
    r.email,r.name||"",r.phone||"",
    r.lastSeenDevice&&r.lastSeenDevice.type||"",
    r.lastSeenDevice&&r.lastSeenDevice.os||"",
    r.lastSeenDevice&&r.lastSeenDevice.browser||"",
    r.lastSeenDevice&&r.lastSeenDevice.id||"",
    r.status||"trial",
    r.plan||"",
    r.registeredAt||"",r.approvedAt||"",r.expiresAt||"",r.paidAmount||""
  ]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="daragat-accounts-"+new Date().toISOString().slice(0,10)+".csv";a.click();
}

function goDash(){
  $("loginPage").style.display="none";
  $("dashPage").style.display="block";
  renderKeygen();
  renderSettings();
  if(!initFB()){switchTab("settings");return;}
  listenAccounts();
  switchTab("all");
}

if(localStorage.getItem(LS_SES)==="1") goDash();
</script>
