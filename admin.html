<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة تحكم التفعيل - الاداره المدرسيه</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:#eef1f6;color:#1a2332;min-height:100vh}

/* ========== Header ========== */
header{background:linear-gradient(135deg,#1a237e 0%,#3949ab 60%,#5c6bc0 100%);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 8px #00000020;position:sticky;top:0;z-index:100}
header h1{margin:0;font-size:16px;font-weight:800;flex:1;min-width:180px;display:flex;align-items:center;gap:8px}
header .cfg{font-size:11.5px;opacity:.9;background:#ffffff22;padding:4px 10px;border-radius:20px;white-space:nowrap}
header .hbtn{border:none;padding:7px 12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:5px;color:#fff}
.hbtn.logout{background:#ef5350}
.hbtn.key{background:#43a047}
.hbtn.pass{background:#6a1b9a}
.hbtn.set{background:#00838f}

/* ========== Tabs ========== */
nav.tabs{background:#fff;border-bottom:1px solid #dcdfe6;display:flex;flex-wrap:nowrap;padding:0 8px;position:sticky;top:54px;z-index:90;overflow-x:auto;gap:2px;box-shadow:0 1px 3px #00000010;-webkit-overflow-scrolling:touch}
nav.tabs button{background:none;border:none;padding:13px 14px;font-size:13px;font-weight:700;color:#606f80;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s}
nav.tabs button.active{color:#1a237e;border-bottom-color:#1a237e;background:#f5f6ff}
nav.tabs button .badge{color:#fff;border-radius:10px;padding:1px 7px;font-size:10.5px;margin-right:5px;font-weight:800;display:inline-block;min-width:18px;text-align:center}
nav.tabs button .badge{background:#ef5350}
nav.tabs button .badge.warn{background:#ff9800}
nav.tabs button .badge.ok{background:#2e7d32}
nav.tabs button .badge.info{background:#1976d2}
nav.tabs button .badge.vio{background:#6a1b9a}

/* ========== Main ========== */
main{padding:14px 12px;max-width:1400px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0000000c;border:1px solid #e7eaf0}
.card-title{font-size:15px;font-weight:800;color:#1a237e;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-title .count{background:#e8eaf6;color:#3949ab;padding:2px 10px;border-radius:20px;font-size:12px}
.card-title .note{font-size:11px;color:#888;font-weight:400}

/* ========== Login ========== */
.login-wrap{max-width:400px;margin:40px auto;padding:0 14px}
.login-wrap .card{padding:24px 22px}
.login-wrap h2{text-align:center;color:#1a237e;margin:0 0 8px;font-size:20px}
.login-wrap .logo{text-align:center;font-size:48px;margin-bottom:6px}
.login-wrap .sub{text-align:center;color:#666;font-size:13px;margin-bottom:18px}

/* ========== Forms ========== */
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cfd4dc;border-radius:10px;font-family:inherit;font-size:14px;margin-top:6px;background:#fafbfc;transition:all .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3949ab;background:#fff;box-shadow:0 0 0 3px #3949ab20}
label{font-size:12.5px;font-weight:700;color:#3d4a5c;display:block;margin-top:12px}
button{font-family:inherit}
.btn{border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;transition:transform .05s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.primary{background:#1a237e;color:#fff}
.btn.success{background:#2e7d32;color:#fff}
.btn.warn{background:#ef6c00;color:#fff}
.btn.violet{background:#6a1b9a;color:#fff}
.btn.whatsapp{background:#25D366;color:#fff;padding:5px 10px;font-size:11.5px;text-decoration:none}
.btn.danger{background:#c62828;color:#fff}
.btn.ghost{background:#eceff1;color:#37474f}
.btn.ghost:hover{background:#dfe3e7}
.btn.small{padding:5px 9px;font-size:11.5px}
.btn.block{width:100%;padding:12px;border-radius:10px;font-size:14px}

/* ========== Toolbar ========== */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar .grow{flex:1}

/* ========== Table ========== */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid #e7eaf0}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
th,td{padding:9px 10px;border-bottom:1px solid #eef0f5;text-align:right;vertical-align:middle}
th{background:#f4f6fb;font-weight:800;color:#3d4a5c;font-size:12px;white-space:nowrap;border-bottom:2px solid #dfe3ea}
tbody tr:hover{background:#f8f9ff}
tr.trial{background:#fffde7}
tr.pending{background:#fff8e1}
tr.approved{background:#e8f5e9}
tr.rejected{background:#ffebee}
tr.conflict{background:#e3f2fd}
tr.reset-pw{background:#f3e5f5}
td .actions{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-start}
td .mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
input.inline,select.inline{width:auto;display:inline-block;padding:4px 8px;font-size:11.5px;margin:2px 2px 2px 0;min-width:70px}

/* ========== Cards view for mobile ========== */
.cards-view{display:none}
.acct-card{background:#fff;border:1px solid #e7eaf0;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #00000008}
.acct-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.acct-card .email{font-family:monospace;direction:ltr;font-size:11.5px;background:#f4f6fb;padding:3px 8px;border-radius:6px;word-break:break-all;display:inline-block}
.acct-card .name{font-weight:800;font-size:14px;color:#1a237e;margin-top:4px}
.acct-card .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;margin:6px 0}
.acct-card .meta b{color:#666;font-weight:700}
.acct-card .actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-top:10px;border-top:1px dashed #e7eaf0}

/* ========== Badges ========== */
.badge-status{padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:800;display:inline-block}
.s-trial{background:#fff9c4;color:#827717}
.s-pending{background:#ffe0b2;color:#bf360c}
.s-approved{background:#c8e6c9;color:#1b5e20}
.s-rejected{background:#ffcdd2;color:#b71c1c}
.s-conflict{background:#bbdefb;color:#0d47a1}
.s-reset-pw,.s-password_reset{background:#ce93d8;color:#4a148c}
.badge-plan{background:#e3f2fd;color:#0d47a1;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:800;display:inline-block;margin:1px}
.code{font-family:monospace;direction:ltr;background:#f6f8fa;padding:2px 6px;border-radius:4px;font-size:11px}
.keybox{direction:ltr;text-align:center;letter-spacing:3px;font-family:monospace;font-size:22px;font-weight:800;background:#e8f5e9;color:#1b5e20;padding:14px;border-radius:10px;margin:12px 0;word-break:break-all}
.muted{color:#777;font-size:12px}
.devicetag{display:inline-block;background:#eceff1;color:#37474f;padding:2px 7px;border-radius:6px;font-size:10.5px;margin:1px}
.cfgbox{background:#ede7f6;padding:12px;border-radius:10px;font-size:12px;color:#4527a0;word-break:break-all;margin-top:10px}
.phone-input{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.phone-input a{flex-shrink:0}

/* ========== Modal ========== */
.modal-bg{position:fixed;inset:0;background:#00000055;z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 40px #00000040}
.modal h3{margin:0 0 10px;color:#1a237e}

/* ========== Stats ========== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:12px;padding:12px 14px;border:1px solid #e7eaf0;box-shadow:0 1px 3px #00000008}
.stat .num{font-size:24px;font-weight:800;color:#1a237e}
.stat .lbl{font-size:11px;color:#666;margin-top:2px}
.stat.warn .num{color:#ef6c00}
.stat.ok .num{color:#2e7d32}
.stat.vio .num{color:#6a1b9a}
.stat.trial .num{color:#827717}
.stat.info .num{color:#1976d2}

/* ========== Responsive ========== */
@media(max-width:760px){
  header{padding:10px 12px;top:0}
  header h1{font-size:14px;min-width:auto}
  nav.tabs{top:46px;padding:0 4px}
  nav.tabs button{padding:11px 10px;font-size:12px}
  main{padding:10px 8px}
  .card{padding:12px;border-radius:12px}
  .tbl-wrap{display:none}
  .cards-view{display:block}
  th,td{padding:6px 5px;font-size:11px}
  .login-wrap{margin:20px auto}
  .login-wrap .card{padding:18px 14px}
  .stats{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat{padding:10px}
  .stat .num{font-size:20px}
}
</style>
</head>
<body>

<!-- ====== LOGIN ====== -->
<div id="loginPage" class="login-wrap">
  <div class="card">
    <div class="logo">🔐</div>
    <h2>لوحة تحكم التفعيل</h2>
    <p class="sub">تسجيل دخول الأدمن</p>
    <label>كلمة السر
      <input type="password" id="loginPass" placeholder="أدخل كلمة السر" autocomplete="current-password" />
    </label>
    <div style="margin-top:14px">
      <button class="btn primary block" onclick="doLogin()">🚪 دخول</button>
    </div>
    <p class="muted" style="margin-top:14px;text-align:center">
      <a href="#" onclick="showCfg(event)" style="color:#1a237e;text-decoration:none;font-weight:700">⚙️ إعدادات Firebase / تغيير كلمة السر</a>
    </p>
    <div id="cfgPanel" style="display:none;margin-top:6px;border-top:1px dashed #ddd;padding-top:14px">
      <h3 style="margin:0 0 4px;font-size:14px;color:#1a237e">⚙️ الإعدادات</h3>
      <p class="muted">الصق كائن firebaseConfig هنا (يُحفظ محلياً فقط في متصفحك).</p>
      <textarea id="cfgJson" dir="ltr" rows="6" style="font-family:monospace;font-size:11px;text-align:left;direction:ltr" placeholder='{"apiKey":"..."}'></textarea>
      <label>كلمة سر الأدمن الجديدة (4 أحرف+):
        <input type="password" id="newAdminPass" placeholder="اتركه فارغاً لعدم التغيير" autocomplete="new-password" />
      </label>
      <label>تأكيد كلمة السر الجديدة:
        <input type="password" id="newAdminPass2" placeholder="أدخلها مرة أخرى" autocomplete="new-password" />
      </label>
      <label>السر المشترك (مفاتيح الأوفلاين):
        <input type="text" id="secKey" value="HSM-DARAGAT-2026-V1" dir="ltr" />
      </label>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn primary" onclick="saveCfg()">💾 حفظ</button>
        <button class="btn ghost" onclick="document.getElementById('cfgPanel').style.display='none'">إغلاق</button>
      </div>
    </div>
  </div>
</div>

<!-- ====== DASHBOARD ====== -->
<div id="dashPage" style="display:none">
  <header>
    <h1>🎛️ لوحة تحكم التفعيل</h1>
    <span class="cfg" id="fbStatus">جاري الاتصال…</span>
    <button class="hbtn key" onclick="switchTab('keygen')">🔑 مفتاح</button>
    <button class="hbtn pass" onclick="openChangePass()">🔒 تغيير كلمة السر</button>
    <button class="hbtn set" onclick="switchTab('settings')">⚙️</button>
    <button class="hbtn logout" onclick="logout()">🚪 خروج</button>
  </header>
  <nav class="tabs">
    <button data-tab="all" class="active">📋 الكل <span class="badge info" id="bAll">0</span></button>
    <button data-tab="trial">🆓 تجريبي <span class="badge" id="bTrial">0</span></button>
    <button data-tab="pending">📞 يريد تفعيل <span class="badge warn" id="bPen">0</span></button>
    <button data-tab="transfers">🔄 نقل جهاز <span class="badge warn" id="bTra">0</span></button>
    <button data-tab="reset">🔑 استعادة كلمة سر <span class="badge vio" id="bRes">0</span></button>
    <button data-tab="approved">✅ المفعّلة <span class="badge ok" id="bApp">0</span></button>
  </nav>
  <main>
    <div class="stats" id="statsBox"></div>
    <div id="tab-all" class="tab"></div>
    <div id="tab-trial" class="tab" style="display:none"></div>
    <div id="tab-pending" class="tab" style="display:none"></div>
    <div id="tab-transfers" class="tab" style="display:none"></div>
    <div id="tab-reset" class="tab" style="display:none"></div>
    <div id="tab-approved" class="tab" style="display:none"></div>
    <div id="tab-keygen" class="tab" style="display:none"></div>
    <div id="tab-settings" class="tab" style="display:none"></div>
  </main>
</div>

<!-- ====== Change Password Modal ====== -->
<div class="modal-bg" id="passModal">
  <div class="modal">
    <h3>🔒 تغيير كلمة سر الأدمن</h3>
    <label>كلمة السر الحالية:
      <input type="password" id="chOld" autocomplete="current-password" placeholder="أدخل كلمة السر الحالية" />
    </label>
    <label>كلمة السر الجديدة (4 أحرف على الأقل):
      <input type="password" id="chNew" autocomplete="new-password" placeholder="كلمة سر جديدة" />
    </label>
    <label>تأكيد كلمة السر الجديدة:
      <input type="password" id="chNew2" autocomplete="new-password" placeholder="أعد إدخال كلمة السر" />
    </label>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn ghost" onclick="closePassModal()">إلغاء</button>
      <button class="btn primary" onclick="doChangePass()">💾 حفظ</button>
    </div>
  </div>
</div>

<script>
const LS_CFG="daragat_admin_cfg_v2";
const LS_SES="daragat_admin_ses";
let db=null, SECRET="HSM-DARAGAT-2026-V1";

const DEFAULT_FIREBASE={
  apiKey:"AIzaSyAyPSUK_8kOGGCBc2fy1pPNSOzBtwenMi0",
  authDomain:"daragat.firebaseapp.com",
  databaseURL:"https://daragat-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"daragat",
  storageBucket:"daragat.firebasestorage.app",
  messagingSenderId:"123733341266",
  appId:"1:123733341266:web:fce19012a0781f96b29b8b"
};

function hash32(str){
  let h=0x811c9dc5>>>0;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0;}
  return (h>>>0).toString(16).padStart(8,"0");
}
function offSig(dev,plan){const b=SECRET+"|"+dev+"|"+plan;const h1=hash32(b),h2=hash32(b+"|chk");return (h1+h2).toUpperCase().match(/.{1,4}/g).join("-");}
function planDays(p){return{weekly:7,monthly:30,yearly:365,permanent:99999}[p]||0;}
function planLabel(p){return{weekly:"أسبوعي",monthly:"شهري",yearly:"سنوي",permanent:"دائم"}[p]||p||"-";}
function statusLabel(s){return{trial:"تجريبي",pending:"ينتظر التفعيل",approved:"مُفعّلة",rejected:"مرفوض",expired:"منتهية",device_transfer_pending:"نقل جهاز",password_reset:"استعادة كلمة سر"}[s]||s||"-";}
function fmtDate(ts){if(!ts)return"-";try{return new Date(ts).toLocaleString("ar-IQ",{dateStyle:"short",timeStyle:"short"});}catch(e){return String(ts);}}
function fmtTime(ts){if(!ts)return"-";try{const d=new Date(ts);const now=Date.now();const diff=now-ts;if(diff<86400000) return d.toLocaleTimeString("ar-IQ",{hour:"2-digit",minute:"2-digit"});return d.toLocaleDateString("ar-IQ");}catch(e){return"-";}}
function $(id){return document.getElementById(id);}
function stageLabel(st){return {elementary:"ابتدائية",intermediate:"متوسطة",prep:"إعدادية"}[st]||st||"";}
function genderLabel(g){return {boys:"بنين",girls:"بنات",mixed:"مختلطة"}[g]||"";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function emailKey(email){return String(email||"").replace(/\./g,",");}
function normIraqPhone(p){
  let digits=String(p||"").replace(/[^0-9]/g,"");
  if(digits.startsWith("964")) digits=digits.slice(3);
  else if(digits.startsWith("00964")) digits=digits.slice(5);
  else if(digits.startsWith("+964")) digits=digits.slice(3);
  if(!digits.startsWith("0")&&digits.length<=9) digits="0"+digits;
  return digits;
}
function waPhone(digits){
  digits=String(digits||"").replace(/[^0-9]/g,"");
  if(digits.startsWith("964")&&digits.length>=12) return digits;
  if(digits.startsWith("00964")) return digits.slice(2);
  if(digits.startsWith("0")&&digits.length===10) return "964"+digits.slice(1);
  if(digits.length===9) return "964"+digits;
  return "964"+digits.slice(-9);
}

function loadCfg(){try{return JSON.parse(localStorage.getItem(LS_CFG)||"null")||{};}catch(e){return {};}}
function saveCfgObj(c){
  try{localStorage.setItem(LS_CFG,JSON.stringify(c));}
  catch(e){
    const keep=[LS_CFG,LS_SES];
    Object.keys(localStorage).filter(k=>!keep.includes(k)).forEach(k=>{try{localStorage.removeItem(k);}catch(_){}});
    localStorage.setItem(LS_CFG,JSON.stringify(c));
  }
}
let cfg=loadCfg();
if(!cfg.firebase) cfg.firebase={...DEFAULT_FIREBASE};
else for(const k in DEFAULT_FIREBASE){if(!cfg.firebase[k])cfg.firebase[k]=DEFAULT_FIREBASE[k];}
if(cfg.secret) SECRET=cfg.secret; else SECRET="HSM-DARAGAT-2026-V1";
let adminHash=cfg.adminHash||"65a4456f";

function showCfg(e){if(e)e.preventDefault();$("cfgPanel").style.display=$("cfgPanel").style.display==="none"?"block":"none";}
function saveCfg(){
  try{
    const t=($("cfgJson")?($("cfgJson").value||"").trim():"");
    let fb=cfg.firebase;
    if(t){try{fb=JSON.parse(t);}catch(e){alert("JSON غير صحيح");return;}}
    cfg.firebase=fb;
    const np=$("newAdminPass").value,np2=$("newAdminPass2").value;
    if(np){
      if(np.length<4){alert("كلمة السر يجب أن تكون 4 أحرف على الأقل");return;}
      if(np!==np2){alert("كلمتا السر غير متطابقتين");return;}
      cfg.adminHash=hash32(np);adminHash=cfg.adminHash;
    }
    const sk=$("secKey").value.trim();
    if(sk){cfg.secret=sk;SECRET=sk;}
    saveCfgObj(cfg);
    alert("✅ تم الحفظ بنجاح");
    location.reload();
  }catch(e){alert(e.message);}
}

function doLogin(){
  const p=$("loginPass").value;
  if(!p){alert("أدخل كلمة السر");return;}
  if(hash32(p)===adminHash){localStorage.setItem(LS_SES,"1");goDash();}
  else alert("كلمة السر غير صحيحة");
}
function logout(){localStorage.removeItem(LS_SES);location.reload();}

/* Change password modal */
function openChangePass(){$("chOld").value="";$("chNew").value="";$("chNew2").value="";$("passModal").classList.add("show");setTimeout(()=>$("chOld").focus(),100);}
function closePassModal(){$("passModal").classList.remove("show");}
function doChangePass(){
  const old=$("chOld").value,n1=$("chNew").value,n2=$("chNew2").value;
  if(!old||!n1){alert("أكمل الحقول المطلوبة");return;}
  if(hash32(old)!==adminHash){alert("كلمة السر الحالية غير صحيحة");return;}
  if(n1.length<4){alert("كلمة السر الجديدة يجب أن تكون 4 أحرف على الأقل");return;}
  if(n1!==n2){alert("كلمتا السر غير متطابقتين");return;}
  cfg.adminHash=hash32(n1);adminHash=cfg.adminHash;
  saveCfgObj(cfg);
  closePassModal();
  alert("✅ تم تغيير كلمة السر بنجاح");
}
$("passModal").addEventListener("click",e=>{if(e.target.id==="passModal")closePassModal();});

function initFB(){
  try{
    if(typeof firebase==="undefined"){$("fbStatus").innerHTML="⚠️ لم يتصل Firebase";return false;}
    firebase.initializeApp(cfg.firebase);
    db=firebase.database();
    $("fbStatus").textContent="● متصل";
    $("fbStatus").title=cfg.firebase.projectId;
    return true;
  }catch(e){$("fbStatus").textContent="❌ "+e.message;return false;}
}

let allAccounts={};
function listenAccounts(){
  db.ref("activation/accounts").on("value",snap=>{
    allAccounts=snap.val()||{};
    renderAll();
  });
}

function approve(email, plan, amount){
  const k=emailKey(email);
  const days=planDays(plan);
  db.ref("activation/accounts/"+k).update({
    status:"approved",plan:plan,
    approvedAt:firebase.database.ServerValue.TIMESTAMP,
    expiresAt:Date.now()+days*86400000,
    paidAmount:amount||""
  });
}
function approveTransfer(email){
  if(!confirm("✅ الموافقة على نقل الاشتراك للجهاز الجديد؟\nسيتم إيقاف الجهاز القديم."))return;
  const k=emailKey(email);
  db.ref("activation/accounts/"+k).once("value",snap=>{
    const v=snap.val()||{};
    const plan=v.plan||"monthly";
    db.ref("activation/accounts/"+k).update({
      status:"approved",plan:plan,
      approvedAt:v.approvedAt||firebase.database.ServerValue.TIMESTAMP,
      expiresAt:v.expiresAt||(Date.now()+30*86400000)
    });
  });
}
function resetPassword(email){
  if(!confirm("🔑 إرسال رمز إعادة تعيين كلمة السر؟\nسيتم توليد رمز 6 أرقام وفتح واتساب الزبون.")) return;
  const key = String(Math.floor(100000+Math.random()*900000));
  const ref = db.ref("activation/accounts/"+emailKey(email));
  ref.update({tempResetKey:key, passwordResetRequestedAt:firebase.database.ServerValue.TIMESTAMP}).then(()=>{
    const msg=encodeURIComponent("🔐 رمز إعادة تعيين كلمة السر لتطبيق الاداره المدرسيه:\nالرمز: "+key+"\n\nافتح التطبيق ⬅️ هل نسيت كلمة السر؟ وأدخل الرمز ثم اختر كلمة سر جديدة.");
    ref.once("value").then(snap=>{
      const v=snap.val()||{};
      const phone=normIraqPhone(v.phone||"");
      if(phone.length>=10){
        window.open("https://wa.me/"+waPhone(phone)+"?text="+msg,"_blank");
      }else{
        prompt("لم يتم العثور على رقم هاتف صحيح — الرمز (أرسله يدوياً):",key);
      }
    });
  }).catch(e=>alert("خطأ: "+e.message));
}
function rejectTransfer(email){
  if(!confirm("رفض طلب النقل؟"))return;
  db.ref("activation/accounts/"+emailKey(email)).update({status:"approved"});
}
function reject(email){
  if(!confirm("تأكيد رفض هذا الطلب؟"))return;
  db.ref("activation/accounts/"+emailKey(email)).update({status:"rejected"});
}
function clearReset(email){
  if(!confirm("إزالة طلب استعادة كلمة السر لهذا الحساب؟"))return;
  db.ref("activation/accounts/"+emailKey(email)).update({tempResetKey:null,passwordResetRequestedAt:null});
}
function del(email){
  if(!confirm("🗑 حذف الحساب نهائياً؟\nالبريد: "+email+"\nهذا الإجراء لا يمكن التراجع عنه."))return;
  db.ref("activation/accounts/"+emailKey(email)).remove();
}
function setPaid(email,amount){db.ref("activation/accounts/"+emailKey(email)).update({paidAmount:amount});}
function setPhone(email,phone){db.ref("activation/accounts/"+emailKey(email)).update({phone:normIraqPhone(phone)});}
function waLink(phone){
  const d=normIraqPhone(phone);
  if(d.length<10) return "#";
  return "https://wa.me/"+waPhone(d)+"?text="+encodeURIComponent("السلام عليكم، بخصوص تطبيق الاداره المدرسيه");
}

let currentTab="all";
function switchTab(name){
  currentTab=name;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
  document.querySelectorAll(".tab").forEach(t=>t.style.display="none");

function deviceBadges(r){
  const d=r.lastSeenDevice||{};
  let h="";
  const type=d.type||"?";
  const os=d.os||"";
  const br=d.browser||"";
  const bv=d.browserVersion||"";
  const brand=d.brand||"";
  const sc=d.screen||"";
  const label = d.label || ((brand?brand+" ":"")+type+" - "+os+(br?" / "+br+(bv?" "+bv.split(".")[0]:""):""));
  h+='<span class="devicetag" title="'+esc(label)+(sc?" — "+sc:"")+'">📱 '+esc(type)+'</span>';
  if(brand)h+='<span class="devicetag" title="'+esc(os)+'">🏷 '+esc(brand)+'</span>';
  if(os)h+='<span class="devicetag">💿 '+esc(os)+'</span>';
  if(br)h+='<span class="devicetag">🌐 '+esc(br)+(bv?" "+esc(bv.split(".")[0]):"")+'</span>';
  if(sc)h+='<span class="devicetag" title="الشاشة">🖥 '+esc(sc)+'</span>';
  return h;
}

function renderAll(){
  const recs=Object.entries(allAccounts).map(([k,v])=>({emailKey:k,email:(v.email||k.replace(/,/g,".")),...v}));
  recs.sort((a,b)=>{const ta=a.registeredAt||0,tb=b.registeredAt||0;return tb-ta;});
  const all=[],trial=[],pending=[],approved=[],transfers=[],resets=[];
  for(const r of recs){
    all.push(r);
    if(r.status==="approved") approved.push(r);
    else if(r.status==="device_transfer_pending") transfers.push(r);
    else if(r.status==="pending") pending.push(r);
    else if(r.passwordResetRequestedAt) resets.push(r);
    else trial.push(r);
  }
  $("bAll").textContent=all.length;
  $("bTrial").textContent=trial.length;
  $("bPen").textContent=pending.length;
  $("bApp").textContent=approved.length;
  $("bTra").textContent=transfers.length;
  $("bRes").textContent=resets.length;
  renderStats(all,trial,pending,approved,transfers,resets);
  $("tab-all").innerHTML=renderTable(all,"كل الحسابات");
  $("tab-trial").innerHTML=renderTable(trial,"الفترة التجريبية");
  $("tab-pending").innerHTML=renderTable(pending,"طلبات التفعيل");
  $("tab-approved").innerHTML=renderTable(approved,"الحسابات المُفعّلة");
  $("tab-transfers").innerHTML=renderTransfersTable(transfers,"طلبات نقل الأجهزة");
  $("tab-reset").innerHTML=renderTable(resets,"🔑 طلبات استعادة كلمة السر");

    inp.addEventListener("change",()=>setPaid(inp.dataset.paidFor,inp.value));

  const k=offSig(dev,plan);
  $("kgResult").innerHTML=`<p style="margin-top:14px;font-weight:700">المفتاح (${planLabel(plan)}):</p>

    <h3 class="card-title">⚙️ الإعدادات</h3>
    <label>إعداد Firebase (JSON):
      <textarea id="sFb" dir="ltr" rows="7" style="font-family:monospace;font-size:12px;text-align:left;direction:ltr"></textarea>
    </label>
    <label>السر المشترك (مفاتيح الأوفلاين):
      <input type="text" id="sSec" dir="ltr" />
    </label>
    <div style="background:#fff3e0;border-radius:10px;padding:10px;margin-top:14px;font-size:12px;color:#795548">
      💡 لتغيير كلمة سر الأدمن استخدم زر <b>🔒 تغيير كلمة السر</b> في الشريط العلوي (يتطلب كلمة السر الحالية).
    </div>
    <div style="margin-top:14px"><button class="btn primary" onclick="saveSettings()">💾 حفظ الإعدادات</button></div>
  </div>`;
  $("sFb").value=JSON.stringify(cfg.firebase,null,2);
  $("sSec").value=SECRET;
}
function saveSettings(){
  try{
    const t=($("sFb").value||"").trim();
    let fb=cfg.firebase;
    if(t){try{fb=JSON.parse(t);}catch(e){alert("JSON غير صحيح");return;}}
    cfg.firebase=fb;
    const sk=$("sSec").value.trim();
    if(sk){cfg.secret=sk;SECRET=sk;}
    saveCfgObj(cfg);
    alert("✅ تم الحفظ. سيتم إعادة التحميل.");location.reload();
  }catch(e){alert(e.message);}
}

function exportCSV(){
  const recs=Object.entries(allAccounts).map(([k,v])=>({emailKey:k,email:(v.email||k.replace(/,/g,".")),...v}));
  const rows=[["#","email","password","name","schoolName","schoolStage","schoolGender","principalName","phone","device_type","device_brand","device_os","device_browser","device_browser_version","device_screen","device_id","status","plan","registeredAt","approvedAt","expiresAt","paidAmount"]];
  recs.forEach((r,i)=>{
    const d=r.lastSeenDevice||{};
    rows.push([
      i+1,r.email,r.password||"",r.name||"",r.schoolName||"",stageLabel(r.schoolStage),genderLabel(r.schoolGender),r.principalName||"",
      normIraqPhone(r.phone||""),
      d.type||"",d.brand||"",d.os||"",d.browser||"",d.browserVersion||"",d.screen||"",d.id||"",
      r.status||"trial",r.plan||"",r.registeredAt||"",r.approvedAt||"",r.expiresAt||"",r.paidAmount||""
    ]);
  });
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="daragat-accounts-"+new Date().toISOString().slice(0,10)+".csv";a.click();
}

function goDash(){
  $("loginPage").style.display="none";
  $("dashPage").style.display="block";
  if(!initFB()){switchTab("settings");return;}
  listenAccounts();
  switchTab("all");
}
document.getElementById("loginPass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
if(localStorage.getItem(LS_SES)==="1") goDash();
</script>
